<style>
/* Layout: une colonne mobile, navigation fixe en bas, quatre modes (mots, fiches, quiz, grammaire). */
:root {
  --bg: #f1f4ef;
  --surface: #ffffff;
  --fg: #12251d;
  --muted: #5b6e64;
  --line: #d6ddd5;
  --accent: #1c7a4b;
  --accent-ink: #ffffff;
  --sun: #f0b323;
  --ok: #1c7a4b;
  --bad: #b8372b;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1a15; --surface: #16261f; --fg: #e6efe9; --muted: #93a79c; --line: #284034;
    --accent: #4fc487; --accent-ink: #062416; --sun: #f3c24a; --ok: #4fc487; --bad: #ee7a6c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1a15; --surface: #16261f; --fg: #e6efe9; --muted: #93a79c; --line: #284034;
  --accent: #4fc487; --accent-ink: #062416; --sun: #f3c24a; --ok: #4fc487; --bad: #ee7a6c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-block: 0 88px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header.top { padding-top: 20px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 2.1rem; line-height: 1; margin: 0; letter-spacing: -0.02em; }
h1 span { color: var(--accent); }
.brand { display: flex; align-items: center; gap: 12px; }
.logo { width: 56px; height: 56px; flex: none; }
.sub { color: var(--muted); font-size: 0.9rem; }
.stripe { height: 5px; border-radius: 3px; background: linear-gradient(90deg, var(--accent) 0 34%, var(--sun) 34% 67%, var(--bad) 67% 100%); }
h2 { font-family: var(--font-display); font-size: 1.25rem; margin: 0; text-wrap: balance; }
h3 { font-family: var(--font-display); font-size: 1rem; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.field {
  width: 100%; padding: 12px 14px; font: inherit; color: var(--fg);
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px;
}
select.field { appearance: auto; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 9px 14px; font-weight: 700; font-size: 0.9rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip { flex: none; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 0.85rem; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.count { color: var(--muted); font-size: 0.85rem; }
.group { font-family: var(--font-display); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); margin: 10px 0 2px; }
.entry { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; display: flex; flex-direction: column; gap: 2px; }
.entry + .entry { margin-top: 6px; }
.entry .a { font-size: 0.9rem; color: var(--muted); overflow-wrap: anywhere; }
.entry .b { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; color: var(--fg); overflow-wrap: anywhere; }
.entry .b.is-lari { color: var(--accent); }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
/* fiches */
.card {
  width: 100%; min-height: 220px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px;
  padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center;
  box-shadow: 0 6px 0 var(--line);
}
.card .tag { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.card .big { font-family: var(--font-display); font-weight: 800; font-size: 1.9rem; line-height: 1.15; overflow-wrap: anywhere; text-wrap: balance; }
.card .big.is-lari { color: var(--accent); }
.card .hint { color: var(--muted); font-size: 0.85rem; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.btn { border: 0; border-radius: 10px; padding: 12px 18px; font-weight: 700; background: var(--accent); color: var(--accent-ink); }
.btn.alt { background: var(--surface); color: var(--fg); border: 1.5px solid var(--line); }
.btn.bad { background: var(--bad); color: #fff; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btns .full { grid-column: 1 / -1; }
/* quiz */
.opts { display: grid; gap: 8px; }
.opt { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 13px 14px; font-weight: 700; overflow-wrap: anywhere; }
.opt.good { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 16%, var(--surface)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--surface)); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.q { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; overflow-wrap: anywhere; text-wrap: balance; }
.score { font-family: var(--font-display); font-size: 3rem; font-weight: 800; color: var(--accent); }
mark { background: color-mix(in srgb, var(--sun) 55%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }
.hit { line-height: 1.5; overflow-wrap: anywhere; }
.lg { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); margin-right: 6px; }
.entry .tog { margin-top: 6px; }
.trout { font-size: 1.1rem; line-height: 1.75; overflow-wrap: anywhere; }
.trw { color: var(--accent); font-weight: 700; }
.miss { color: var(--muted); border-bottom: 2px dotted var(--bad); }
.note { color: var(--muted); font-size: 0.85rem; line-height: 1.5; }
.wrapchips { display: flex; flex-wrap: wrap; gap: 6px; }
details.panel summary { cursor: pointer; font-weight: 700; }
textarea.field { resize: vertical; font-family: var(--font-body); line-height: 1.5; }
/* textes */
.textcard { text-align: left; display: flex; flex-direction: column; gap: 4px; width: 100%; }
.is-lari-txt { color: var(--accent); font-family: var(--font-display); font-weight: 600; }
.para { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.pn { align-self: flex-start; font-family: var(--font-display); font-weight: 800; font-size: 0.8rem; color: var(--accent-ink); background: var(--accent); border-radius: 999px; padding: 1px 9px; }
.lt { margin: 0; font-size: 1.05rem; line-height: 1.65; overflow-wrap: anywhere; }
.ft { margin: 0; padding: 10px 12px; background: var(--bg); border-left: 4px solid var(--sun); border-radius: 6px; line-height: 1.6; overflow-wrap: anywhere; }
.tog { align-self: flex-start; border: 1.5px solid var(--line); background: transparent; border-radius: 8px; padding: 6px 12px; font-size: 0.85rem; font-weight: 700; color: var(--accent); }
/* grammaire */
.gr { display: grid; gap: 10px; }
.cls { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: baseline; }
.pre { font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; color: var(--accent); }
.ex { background: var(--bg); border-radius: 8px; padding: 8px 10px; }
.ex b { color: var(--accent); }
.det { color: var(--muted); font-size: 0.85rem; }
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(6, 1fr);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));

nav.tabs button { border: 0; background: transparent; padding: 10px 2px; border-radius: 10px; font-weight: 700; font-size: 0.72rem; color: var(--muted); }
nav.tabs button[aria-current="page"] { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .25s; } }
</style>

lle du 30 octobre"}]}, {"nom": "Conjugaison : passé composé (prendre, frapper)", "entrees": [{"fr": "j'ai pris", "lari": "na bongele"}, {"fr": "tu as pris", "lari": "wa bongele"}, {"fr": "il/elle a pris", "lari": "ka bongele"}, {"fr": "nous avons pris", "lari": "tu bongele"}, {"fr": "vous avez pris", "lari": "lu bongele"}, {"fr": "ils/elles ont pris", "lari": "ba bongele"}, {"fr": "j'ai frappé", "lari": "na tuidi / na twidi"}, {"fr": "tu as frappé", "lari": "wa tuidi"}, {"fr": "il/elle a frappé", "lari": "ka tuidi"}, {"fr": "nous avons frappé", "lari": "tu tuidi"}, {"fr": "vous avez frappé", "lari": "lu tuidi"}, {"fr": "ils/elles ont frappé", "lari": "ba tuidi"}]}], "grammaire": {"classes_nominales": [{"classe": "Classe 1 (humain, singulier)", "prefixe": "mu-", "fr": "une personne", "lari": "mûntu"}, {"classe": "Classe 2 (humain, pluriel)", "prefixe": "ba-", "fr": "des personnes", "lari": "bântu"}, {"classe": "Classe 7 (objets, langues, singulier)", "prefixe": "ki-", "fr": "la langue lâri", "lari": "kilâri (ou lâri)"}, {"classe": "Classe 8 (objets, pluriel)", "prefixe": "bi-", "fr": "des choses", "lari": "bîma"}], "regles": [{"titre": "Emprunts au français", "texte": "Un mot français peut être emprunté tel quel en lari, sans article.", "exemples": [{"fr": "le dictionnaire", "lari": "dictionnaire"}, {"fr": "le téléphone", "lari": "téléphone"}]}, {"titre": "Syntaxe : le complément en tête", "texte": "La phrase peut commencer par le complément : complément + pronom personnel + verbe.", "exemples": [{"fr": "il mange du pain", "lari": "di mpa ka ta dia", "detail": "di mpa = du pain · ka ta = il · dia = mange"}, {"fr": "nous chantons une chanson", "lari": "mukunga tu ta tanga", "detail": "mukunga = une chanson · tu ta = nous · tanga = chante"}]}, {"titre": "Le pluriel : ba et ma", "texte": "Devant un nom de personne ou d'animal, « ba » marque le pluriel (les, des) et peut s'employer comme préfixe. Pour les choses, on emploie « ma » (les, des). Au singulier, le nom reste seul.", "exemples": [{"fr": "les femmes", "lari": "ba nkento", "detail": "ba = les · nkento = femme"}, {"fr": "les chiens", "lari": "ba mbwa", "detail": "mbwa = un chien, une chienne"}, {"fr": "les prophètes", "lari": "ba mbikudi", "detail": "mBikudi = un prophète"}, {"fr": "les feuilles", "lari": "ma kaya", "detail": "ma = les · kaya = feuille"}]}, {"titre": "Les verbes : terminaison et groupes", "texte": "Tous les verbes lari se terminent par « a », quel que soit leur groupe. Les groupes servent seulement à classer les exemples.", "exemples": [{"fr": "1er groupe : manger, tomber, chanter, avancer, pousser", "lari": "dia, bwa, tanga, pusa, pusa"}, {"fr": "2e groupe : finir, grandir, choisir", "lari": "manisa, kula, sola"}, {"fr": "3e groupe : prendre, devoir, tenir, craindre", "lari": "bonga, defa, simba, tina"}]}, {"titre": "Conjugaison à l'indicatif", "texte": "La forme du verbe change avec le temps. IFV = infinitif verbal (dia pour manger). Pronoms : ni (je), wa (tu), ka (il/elle), tu (nous), lu (vous), ba (ils/elles).", "exemples": [{"fr": "Présent", "lari": "IFV + pronom (+ ta) + IFV", "detail": "je mange = dia ni ta dia"}, {"fr": "Futur simple", "lari": "mbo + pronom + IFV", "detail": "je mangerai = mbo ni dia · tu mangeras = mbo wa dia · nous mangerons = mbo tu dia"}, {"fr": "Passé simple", "lari": "na / wa / ka / twa / lwa / ba + IFV", "detail": "je mangeai = na dia · nous mangeâmes = twa dia"}, {"fr": "Imparfait", "lari": "IFV + mbele / bele / kabele / tubele / lubele / babele + IFV", "detail": "je mangeais = dia mbele dia · ils mangeaient = dia babele dia"}]}, {"titre": "Di et ma : singulier et pluriel", "texte": "Pour certains noms, « di » marque le singulier et « ma » le pluriel.", "exemples": [{"fr": "le péché / les péchés", "lari": "di sumu / ma sumu"}, {"fr": "un mage / les mages", "lari": "tuti / matuti"}]}, {"titre": "Passé composé : le participe passé (P.P)", "texte": "Le participe passé se forme en remplaçant la terminaison « a » (ou « à ») de l'infinitif par : ini, ele, ene, idi, i ou e. La terminaison dépend du verbe. Puis on place devant le pronom : na (je), wa (tu), ka (il/elle), tu (nous), lu (vous), ba (ils/elles). À l'oral, on ne prononce pas les pronoms du singulier.", "exemples": [{"fr": "en « ini »", "lari": "yina > yinini (haïr) · mona > muini (voir)"}, {"fr": "en « ele »", "lari": "zola > zolele · pesa > pesele · bonga > bongele · sêkà > sêkele (dormir, s'allonger) · séka > sékele (rire, se moquer) · djioka > djiokele · tia > tiele · lenda > lendele · defa > defele · yioka > yiokele · tomba > tombele"}, {"fr": "en « idi »", "lari": "tula > tudidi · dia > diidi · bika > bikidi · mfuta > mfutidi · tambika > tambikidi · simba > simbidi · fua/fwa > fuidi · yabika > yabikidi"}, {"fr": "en « e »", "lari": "tokesa > tokese (bouillir)"}, {"fr": "en « i »", "lari": "manisa > manisi · kàdisa > kàdisi · zàba > zébi"}, {"fr": "en « ene »", "lari": "tsoneka > tsonekene (écrire)"}, {"fr": "j'ai pris", "lari": "na bongele", "detail": "tu as pris = wa bongele · nous avons pris = tu bongele"}, {"fr": "j'ai frappé", "lari": "na tuidi (ou twidi)", "detail": "ils ont frappé = ba tuidi"}]}, {"titre": "Sources", "texte": "Une partie du vocabulaire provient de la thèse de Renouard-Kivouvou (2017), « Dictionnaire lari-français : maquette de la lettre B » (licence CC BY-NC-ND). Application gratuite, sans but commercial.", "exemples": []}]}, "textes": [{"titre_lari": "Kacou 26 : Wa ma tieleka Nzambi waka télé ti ?", "titre_fr": "Dieu a-t-il réellement dit ?", "reference_fr": "Kc.23v7", "paragraphes": [{"n": 1, "lari": "tiangu ti, mu mpadi mù nzololo nzonza samu éwu: Wa ma tieleka Nzambi waka télé ti ? Tomweno tala buna bu fwanakané mu Genèse 3: 1 ti 6! Ntété mu Genèse 2:16 mpé 17, Nzambi wa télé ku Adami ka diandi muti wa mayela mama bote na mama bi. Éva ka ba koko ni Adami wa mu longa wo. Bo nioka bo ka yizidi, ni ku iandi ka yenda.", "fr": "Bien, ce matin je voudrais parler du sujet : Dieu a-t-il réellement dit ? Remarquez bien Genèse 3 :1 à 6 ! D'abord en Genèse 2 :16 et 17, Dieu commanda à Adam de ne pas manger de l'arbre de la connaissance du bien et du mal. Ève n'était pas là et c'est Adam qui le lui prêcha. Mais quand le serpent vint, c'est vers elle qu'il alla."}, {"n": 2, "lari": "Nioka na Éva ni beri nzonza ka mwa ntangu mpé ni ba yi nzonzela samu wa di sumu dia sexe nganti ba sa bu nsuza na yandi. Nioka ni kamu nzonzela nsalulu za bu nsuza ni ba sidi bu nsuza, ni menga ma dukidi ku Éva mpé ma nata ndoko ra tôto ti. Tiangu ti ni menga Abel ka nsongele mpé mu tangu ya ma nsukina, Mfumu Yésu Christo ka nsongele menga mandi ména ma ntalu, mpé ni makatudi di sumu dia bo ba solo mu mbandu ba télé mbandu, na ba ma mê, méno mBikudi kacou Philippe nta lu nzonzela.[ Ndr: di bundu di télé : <<Amen!>>].", "fr": "Le serpent et Ève causèrent un moment et abordèrent le sujet du péché de sexe afin de commettre adultère avec elle. Le serpent lui parla de relation sexuelle et ils commirent adultère, et le sang coula de devant Ève et apporta la malédiction sur la terre. C’est pourquoi c’est le sang que Abel présenta et à la fin des temps, le Seigneur Jésus-Christ présenta son propre sang qui est le sang le plus précieux, et cela effaça le péché de tous les élus de génération en génération, ainsi que les miens, moi le prophète Kacou Philippe qui vous parle. [Ndr : l’assemblée dit : « Amen ! »]."}, {"n": 3, "lari": "Tiangu, rana bandu ni mu sexe ndoko ya kota ra toto ti. Tiangu lu lombolo na luvé mu nvukana na n'kento WA lombolo kwela ku nganda diandi. [Ndr: Dibundu di télé : Amen !>>]. Satana waka zaba kâ taléno miéka yidika: Satana wa ta<< ti! Nzambi ébu katele : ka lu fwena dia ko>>?", "fr": "Ainsi, au commencement c’est par le sexe que la malédiction toucha la terre. Et vous n’avez pas le droit de coucher avec une femme que vous n’avez pas marié auprès de ses parents. [Ndr : L’assemblée dit : « Amen ! »]. Satan était bien au courant de cela mais voyez sa réaction : Satan a dit « Quoi ! Dieu a dit : vous n'en mangerez pas » ?"}, {"n": 4, "lari": "Nzambi wa télé mu verset 17 ya Genèse 2: << bo, lumbu tio tie dia yo, léndi fwa>>. Ka nioka wa télé mu Genèse 3 :4: << ka léndia fwa ko>>. Tiangu ti, ni wo bantu ba lombo bakula lumbu ti. Nka nso butieleka bu lendi duka mu mwa wa twadisi ya mpélo, ngérozo, evangelique na ya branhamiste, samu wéwo kéna mBikudi ko ya mbandu yi mpé ka yandia ko lu fweni lwila. [ Ndr: di bundu di télé : <<Amen !>>]. Ni rana Éva ka bebisila. Tiangu , Éva ka sidi ntembe mpé ni ka dia yo, mpé méso mandi ni mazubuka mpé ni ka batika mu mona ndoji za zingi mpé na bi moni Tiana mBikudi, Nzambi. Mio mia tula rana bandu ni mio mi tula mu tangu ya ma nsukina.", "fr": "Dieu avait dit au verset 17 de Genèse 2 : « Car, au jour où tu en mangeras, tu mourras certainement ». Mais le serpent a dit dans Genèse 3 :4 : « Vous ne mourrez point certainement ». Et cela, c’est ce que les gens ne comprennent pas aujourd’hui. Peu importe la vérité qui peut sortir de la bouche d’un dirigeant catholique, protestant, évangélique et branhamiste, le problème c’est qu’il n’est pas le prophète de la génération et ce n’est pas lui que vous devez écouter. [Ndr : l’assemblée dit : « Amen ! »]. Et ce fut l’erreur de Ève. Finalement, Ève douta et en mangea, et ses yeux s'ouvrirent et elle eut beaucoup de songes et de visions comme un prophète, un Dieu. Et ce qui arriva au commencement, c'est ce qui arrivera à la fin des temps."}, {"n": 5, "lari": "Bala ba bakala ba Nzambi na ba nkuyu bo ba mvutu wa Satana. Bo bavutu tanga ma buku ma ba evangelique, bo bavutu wa ma longi ma ba evangeliques, bo ba bika baba nteseka moko ku bala baba bakala ba mu nkuyu bo bemo ma bundu ma ba mpélo, ngérozo, évangéliques na branhamistes. Na mio, meso mawu mbô ma jibuka mpé bo baba na ndoji za zingi. [Ndr: di bundu di télé : <<Amen!>>].", "fr": "Les fils de Dieu et les fils du diable écouteront encore Satan. Ils liront les livres évangéliques, ils écouteront les prédications évangéliques, ils se laisseront imposer les mains par les fils du diable qui agissent dans ces églises catholiques, protestantes, évangéliques et branhamistes. Et avec cela, leurs yeux s’ouvriront et ils auront beaucoup de songes. [Ndr : l’assemblée dit : « Amen ! »]."}, {"n": 6, "lari": "Tangu yi ti ta kaletiéno rana ratu batikidi. Ntété nsombolo, Satana mu kati dia mbala ma nioka kedi ta ébu : << toko kela ti lumbu tio tia ba wa lunga, bwa landa Nzambi! Wa tidi twenia bu fwanakané mpé :<< toko yidika Zingu tiaku ntété ! Kwendandi ntinu !>> Mpé, rama nima ma ntambulwandi, bu ka mweni builu'iandi, weka batika mu ta: << ti bi ta nsongesa ti mio mieka tama ta miena mia bu tieleka ? Ti bita nsongesa ti ni kuna kwena bu tieleka ??", "fr": "Maintenant revenons à notre texte. Avant la conversion, Satan à travers les enfants du serpent disait : « Attends le jour où tu auras une situation stable, tu pourras suivre Dieu ! Tu es encore trop jeune » ou encore : « Mets ta vie en ordre d'abord ! Ne te presse pas ! » Puis, après l'engagement, voyant sa chute, il commençait à dire : « Qu'est-ce qui prouve que ce qu'il dit est vrai ? Qu'est-ce qui prouve que c'est là-bas que se trouve la vérité » ?"}, {"n": 7, "lari": "Bo lumbu tio nioka tieka mona buku dia mBikudi kacou Philippe, boka sa mayela mama bi mpé na vwenzolo: << oh, buku dio dia nzebi! Wo kani kacou Philippe akô>>? Ti, zabeno ti ni nioka yokwa ya wuna Éva. Ka lubandi ba wubakana! [Ndr: di bundu di télé :<<Amen!>>].", "fr": "Et quand un jour le serpent verra le livre du prophète Kacou Philippe, il dira avec ruse et mépris : « Oh, je connais ce livre ! N'est-ce pas Kacou Philippe » ? Alors, sachez que c'est le même serpent qui avait séduit Ève. Ne soyez pas distraits ! [Ndr : l’assemblée dit : « Amen ! »]."}, {"n": 8, "lari": "Mbo kakota mu bala ba bakala ba Bélial mu ta ti:<< dio tia di bundu dio djieba fungulaka ra yungi dia bantu masimu! Nsoni ze! Yenda kwakà!... Dio tia di bundu di fundisa bantu ka Nzambi télé ti kalu fundisadi ! Bwe di bundu di léndi yokela biblia?... Bio binzambi nzambi>>.", "fr": "Il entre en des fils de Bélial pour dire : « Quelle est cette église où l'on confesse publiquement ses péchés ! C'est trop honteux ! Va ailleurs ! … Quelle est cette église qui juge les gens alors que Dieu dit de ne pas juger ! Comment une église peut-elle brûler une bible ? … C'est une secte »."}, {"n": 9, "lari": "Ni ku koté kwa ya bo ba lembolo na ngolo ka iokelanka mpé lumbu, Satana bo ka sampirika boka ntati mu bala ba bala ba nioka: <<ti! wama tieleka Nzambi waka télé ti biblia dia Louis Segond diena dia mbote ko>>? Mpé Éva nika kuta mwa tangu kà taléno nioka kamu bakila: << Mbô ti biblia dia Louis Segond diena dia mbote ko Mpé waka twikisi néti bo bwa tawata, ngana ni mu nta ti fweni dia ioka ? Wama tieleka Nzambi waka télé ti>>? Mpé Éva jimbakane, mpe nioka lendi : << kalu yiokandi dio! Yimineno dio kwa!>>.", "fr": "Et c'est toujours du côté des faibles qu'il passe et un jour, Satan se dévoilera disant par les arrière-petits-fils du serpent : « Quoi ! Dieu a-t-Il réellement dit que la bible Louis Segond n'est pas bonne » ? Et Ève a résisté un moment mais voici où le serpent va l'avoir : « Mais si la bible Louis Segond n'est pas bonne et qu'il l'a prouvé comme tu le dis, est-ce pour autant qu'il faut la brûler ? Dieu a-t-Il réellement dit cela » ? Et Ève est désorientée, et le serpent continue : « Ne la brûlez pas ! Déconseillez-la simplement ! »."}, {"n": 10, "lari": "Mpé néti mu ntsaba ya Éden,Satana mbo ka mvutu bwa sa mu bala ba nioka bô ba tanka tsi bawu ba <<chrétiens>>. Satana mbôka bonga mambu ma mpé buka ta tsi :<<mio mika tata, mwabu tseleka mò bwena kà ngana konso muntu fwena katuka mu dibundu diandi mu kwénda ku iandi? Nzambi mu kati dia iandi kwa ka Sadidi mpé ka lendia ka nata bantu baba nso ku iandi ko. Ni ku Christo ba fweti nata bantu !>>lu mweni? mio mika tata mi delakene na butieleka kà zu dia nioka kwa diena. [Ndr: Di bundu di télé<<Amen!>>]", "fr": "Et comme dans le jardin d'Éden, Satan le fera encore par les fils du serpent se disant « chrétiens ». Le serpent prendra ce Message et dira : « Ce qu'il dit, il y a des choses vraies dedans mais est-ce pour autant que tout le monde doit quitter son église pour venir auprès de lui ? Dieu a tout juste œuvré au travers de lui et il ne doit pas conduire tout le monde à lui. C’est à Christ qu’il faut conduire les gens ! ». Vous voyez ? Ce qu’il dit paraît vrai mais c’est un sifflement de serpent. [Ndr : l’assemblée dit : « Amen ! »]."}, {"n": 11, "lari": "Béno lu fwakané mu katuka mu nzo nzambi zéno catholique, protestant, evangelique mpe branhamiste mu kwiza mu mambu mà, mu kwiza ku mBikudi ya moyo ya ntangw'eno.[Ndr:Di bundu di télé:<<Amen!>>].Èva wa fwanakana mubà ga lweka lwa Adami. Mpe ntangu zanza'nso Èva zaka keti bà ga lweka lwa Adami ,ka ketia longa kô. Tima ni tio kwa lu fweni sa mu ntambula lu Zingu lwa mankululu . Ni mu bo Nzambi kata lu tambidila. Béno ba lwengese! [Ndr:Di bundu di télé :<<Amen!>>].", "fr": "Vous devez quitter vos églises catholiques, protestantes, évangéliques et branhamistes et venir à ce Message, venir auprès du prophète vivant de votre temps. [Ndr : l’assemblée dit : « Amen ! »]. Ève devait rester auprès d’Adam. Et aussi longtemps que Ève restait auprès d’Adam, elle ne péchait pas. C’est la seule chose que vous devez faire pour avoir la Vie éternelle. Et c’est à cela que Dieu vous appelle. Vous êtes avertis ! [Ndr : l’assemblée dit : « Amen ! »]."}, {"n": 12, "lari": "Bata ku Noa Ébu :<<Ta zolo ta tsi ni nge kaka kwa we mu butieleka? Mbô Adam, Abel , Henock, mpe bô babansoni ba fwa avant nge >>mia bata ku Mfumu Yésu-Christo, ku ba mbikudi, ku bilandi mpe mu ntangu yi ku béto neti butieleka bo'le bwe. Bata ébu: <<Noa! donc mu toto wa mvimba, tala muntu ka kotela mu bwatu bwaku kô, Nzambi bo ka mu diamisa mu mvula >>. Bu bedi seka mpe bedi seka Noa. Mpé mpila mosi kwa lumbu tsi.", "fr": "Ils ont dit à Noé : « Tu veux dire que c'est toi seul qui es dans la vérité ? Et Adam, Abel, Hénoc, et tous ceux qui sont morts avant toi » Ils ont dit cela au Seigneur Jésus-Christ, aux prophètes, aux apôtres et maintenant à nous comme s'il y a deux vérités. Ils ont dit : « Noé ! Donc sur toute la terre, si quelqu'un n'entre pas dans ton arche, Dieu va l'engloutir dans le déluge » Ils riaient et se moquaient de Noé. Et c'est la même chose aujourd'hui."}, {"n": 13, "lari": "Mbô ba seka mpe mbô ba seka mu nzo nzambi zawu, ku bi salu biawu,mu nzo zawu. Mbô ba ta: << tia fwaso mu toto ti wa mvimba ,ni mu iandi kwa Kacou Philippe tu fweni kwikila mu bvuka? kani ! Nzambi kalendia kata bokò! Mvukisi ni Yésu-Christo.Ni iandi wa fwa ga kulusu. Ni iandi wa tu kula. Mu sumuki néti nge kacou Philippe, ngana ni nge tu kula bùbù? bwe na bwe mita zolo ta mio? Nzambi wa ma tieleka ni bo kata mu lumbu tia 24 Avril 1993>>? Wa ma tieleka kundi , Nzambi ni bo Kata!", "fr": "Ils rient et se moquent dans leurs églises, dans leurs bureaux, dans leurs maisons. Ils disent : « Comment sur toute la face de la terre, c’est en lui seul Kacou Philippe que nous devons croire pour être sauvés ? Non ! Dieu ne peut pas dire cela ! Le Sauveur c’est Jésus-Christ. C’est lui qui est mort sur la croix. C’est lui qui nous a rachetés. Un pécheur comme toi Kacou Philippe, est-ce toi qui vas nous sauver maintenant ? Qu’est-ce que cela veut dire ? Dieu a-t-Il réellement dit cela le 24 avril 1993 » ? Oui monsieur, Dieu l’a dit !"}, {"n": 14, "lari": "Mpila mosi Mari ka butidi mu bimangu kani bakala ka zaba, Mpila mosi Mosé ka tabudi mio mia maso ma yoka ku mbandukulu nge mpe tabudi mambu ma Imvu na imvu lumbu tia 24 Avril 1993 mpe mikangamané ku Nzambi, ntangu bu yi lunga mbu bakuswa mpe bô longa mio miowa lombo longoka kansi konso muntu kwikila ka tabumbula moyo wa Imvu na imvu. Di bundu di télé<<Amen>> Nzambi waka ku Noa, Nzambi waka ku Mosé, Nzambi waka ku ba bikudi babo nsoni mu ntangwa wu.", "fr": "« De la même manière que Marie a conçu miraculeusement sans connaître d’homme, de la même manière que Moïse a reçu dans les détails ce qui s’est passé à la création, toi aussi tu as reçu les Paroles de la Vie éternelle ce 24 avril 1993 et cela est arrêté de la part de Dieu. Au temps marqué, tu comprendras et tu enseigneras ce que tu n’as pas appris afin que quiconque croit, ait la Vie éternelle. ». [Ndr : l’assemblée dit : « Amen ! »]. Dieu l’avait dit à Noé. Dieu l’avait dit à Moïse, Dieu avait dit à tous les prophètes en leur temps."}, {"n": 15, "lari": "Mpé lumbu ti, Nzambi waka télé ku bikudi kacou Philippe mu lumbu tia 24 Avril 1993. Mpe ti lwena mwana Nzambi, ni mu iandi, kacou Philippe lu fweni kwikila mu mvuka. Mboko ti wa tieleka Mpeve ya longo ye neno, Mpeve yo ya longo mbo yi lu nata ku iandi, bikudi ya ntangw'eno, néti ti lumbu, Mpeve yo ya longo ya nata Corneille ku Pierre iandi wa ba na mvungula za maZulu. Di bundu di télé<<Amen>> . Mbô ti weneno lwa sadila Nzambi, ni mu wakasa nsangu za mio mi télé bikudi kacou Philippe, bikudi ya moyo ya ntangu yi: mpé ni xi kwa lu fweni sa>>", "fr": "Et aujourd’hui, Dieu l’a dit au prophète Kacou Philippe le 24 avril 1993. Et si vous êtes un enfant de Dieu, c’est en lui, Kacou Philippe que vous devez croire pour être sauvé. Et si vous avez réellement le Saint-Esprit, ce Saint-Esprit vous conduira à lui, le prophète de votre temps, comme un jour, ce Saint-Esprit a conduit Corneille vers Pierre qui avait les clés du Royaume des Cieux. [Ndr : l’assemblée dit : « Amen ! »]. Et si vous devez servir Dieu, c’est de faire l’écho de ce que le prophète Kacou Philippe, le prophète vivant de votre temps dit. Et c’est la seule chose que vous puissiez faire."}, {"n": 16, "lari": "Or Satana ka kwiza kwa mu nzonzolo ko kà na mu mabanza, Satana mbôka ta kala fweti ku manima mu ntomo tala Satana mbôka dinga mu lu nata mala na di bundu, ngati ka luzimbangasa kulu bika di, kani nsamu ka lumangisa kadi ku nzo nzambi tala ka lwena na mpemba ya fwanakana ko, Bikeno dila zanza nsoni mu kweda yo ya Nzambi, Solone lwa sala mu kumbisa Nzambi ké lwendi lwa kumbisa mvumbi.", "fr": "Or Satan ne viendra pas seulement en parole mais aussi en pensée. Satan dira : « Prends un peu de recul pour bien voir ! ». Satan cherchera à vous éloigner de l'assemblée pour vous éteindre. Ne cédez jamais ! Pour rien au monde, ne manquez jamais à un culte sauf pour une raison juste. Annulez tous les rendez-vous pour être à celui de Dieu. Choisissez de rester pour adorer Dieu plutôt que d'aller enterrer un mort. Et que celui qui a des oreilles pour entendre entende !"}]}, {"titre_lari": "Kacou 91 : Germe za imitation", "titre_fr": "Germes d'imitation", "reference_fr": "Kc.80v6, Kc.90v11, Kc.130v5, Kc.2v11, Kc.3v12, Kc.31v18", "paragraphes": [{"n": 1, "lari": "gâta dia ni ba sidi ma tanga mu bungu dia nkento mosi yokele nlongi! Ni bà zolô na ba gana mbongo! Mêno ka na sa boko , kani sa bwa sa ko! Néti bitezo bia mvukulu ku banzonzi ba Paolo(Paul) mu nzila ya Damas, ntala mu kunga wa ba mbazi ga kati dia wu wa renia tima ko, balenda ba ku nata ko mu ti ndoki tia wu! Tula nkento ku matu mu nzo nzambi wéna ngonda zandi, gâta dia dia nso di lendi ntambulu ka Josua tele ti : Méno na nzwani , nzambi kwa tu sadila. [Ndr: kangu wu télé «Amen!»].", "fr": "Mon village vient de fêter une femme pasteur ! Ils ont voulu que j’y apporte une contribution financière ! Bien sûr que je ne l’ai pas fait et que je ne le ferai jamais ! Comme les aiguillons de la délivrance sur les compagnons de Paul sur le chemin de Damas, si le chant d’anges au-dessus d’eux n’a rien produit sur eux, ils ne pourront jamais m’entrainer dans leur sorcellerie ! Placer une femme à l’autel avec ses menstrues, tout le village peut être d’accord mais Josué a dit : Moi et ma maison, nous servirons l’Éternel ! [Ndr : L’assemblée dit : « Amen ! »]."}, {"n": 2, "lari": "Biyuvu biole biénani bia ni fweti rana mvutu: Néti: nkunzi Philippe, ngana bu boté ti sadi tia Nzambi ka kwela mpamba lenga? mvutu i ni yawu: ntala wokena bu boté kà wa ntété i andi béné ti sadi tia Nzambi ntala ntomono diata bu boté neti i andi, nlemvo wô lu lendi ba wa i andi, ti kani mu bu nlemvo , ti sadi tia Nzambi ka wena ko ti ni buna kwa bu fwanakéné ka bonga kwa mpamba lenga.", "fr": "J’ai ici deux questions auxquelles je dois répondre. Bien : « Frère Philippe, est-ce meilleur ou nécessaire qu’un serviteur de Dieu épouse une vierge » ? Et voici la réponse : S’il y en a d’accord mais ce qui compte d’abord c’est lui-même le serviteur de Dieu ! S’il a assez bien vécu comme elle, cette grâce peut être un droit pour lui, sinon sous la grâce, un serviteur de Dieu n’a pas obligation d’épouser une vierge."}, {"n": 3, "lari": "Tiyuvu tia nzolé é ti: nkunzi Philippe, tsi mwiélo miéto mia ma zulu ma zuvuka kwa ni mu 2002, ,mbo kwé beri bo ba fwa depuis 1993 mpe ba keti nkota?Ba Nkunzi , mwiélo miéna bi sadi bia Nzambi bia suasuana ga-rà kà muélo wati baka tia tila ni Bikudi yéba ntambikidi! tiangu ti, bantu ba fwa, ba vukidi mu ménga ma Christo, ba ba kutolo tia na bô ba mu malongi ma ntama! Bobô mu 2002, Zû dia wakana mu ntoto, mwiélo mia zubuka ku ma zulu. Voile za ba catholique, protestant, évangélique na ba branhamiste za nténdoka ku zulu ti kuti! Ni na télé ti bo malongi ya Zu dia mpimpa ma wakané ra toto ti, boka dia nténda filets za ba catholique, protestant, évangéliques na branhamistes mpe dia ningasé mwiélo mia mbungulu. Ni mu 2002, bo zu dia wakéna bantu ba fwa mu Christo mu kéla zu dia mpimpa ba kotélé. kangu wu télé : Amen", "fr": "La deuxième question est : « Frère Philippe, si les portes de notre cité céleste ne se sont ouvertes qu’en 2002, où étaient ceux qui sont morts depuis 1993 et qui devaient y entrer » ? Frères, les portes, ce sont les différents ministères ici mais la porte de la muraille c’est le prophète messager ! Ainsi, les morts, bien que rachetés par le sang de Christ, dormaient simplement comme ceux de l’Ancien Testament ! Et quand en 2002, le Cri retentit sur la terre, les portes s’ouvrirent dans le Ciel. Les voiles catholiques, protestants, évangéliques et branhamistes se déchirèrent depuis le haut jusqu’en bas ! Et j’ai dit que lorsqu’une prédication du Cri de minuit retentit sur la terre, cela déchire les filets catholiques, protestants, évangéliques et branhamistes et ébranle les portes du hadès. C’est donc en 2002, quand le Cri retenti que les morts en Christ dans l’espérance du Cri de minuit sont rentrés. [Ndr : L’assemblée dit : « Amen ! »]."}, {"n": 4, "lari": "Ntambuléno na ta é bu: ntala Nzambi wena wa délakana, Ndia ya iyo nsoni ya Israël yi fweti ba kwe ba Yudayu. Ka Nzambi longesé ti, bo ntamburi ba bakala ba ma duka bawu na bawu mpe ba nkento bawu na bawu, ba Palisaî bena na swa za nzambi ba ba ko ku bena ku ntoto wa israëli! Bio ba mbuta zawu ba wombésa mu sambila nkuyu, lu fweni lwa ba kadisila ntala béno mpé lu zololo mu sambila mu nkuyu! kangu wu ntélé Amen!", "fr": "Maintenant permettez que je dise ceci : Si Dieu est logique, toute la terre d’Israël doit être aux Juifs. Mais Dieu enseigne que, quand on opte pour les homosexuels et lesbiennes, les Palestiniens ont un droit divin d’être là où ils sont présentement sur la terre d’Israël ! Ce que leurs ancêtres ont perdu en adorant le diable, vous devez le leur restituer si vous voulez aussi adorer le même diable ! [Ndr : L’assemblée dit : « Amen ! »]."}, {"n": 5, "lari": "bantu bo bata nduka bawu na bawu ngana ba lenzi sa défiler ku ba arabes? Kani! Nzambi ya israëli ya ntama, ni Nzambi yo yéri longaka ba santo ba bikudi ka nzambi ya israëli ya lumbu ti ni Amérique! ka ménwa ko fwéni waba téla, tiangu Nzambi ka ba tambikidi Elia na Mose na Nsangu zi ta ba sémba!", "fr": "Les homosexuels et les lesbiennes peuvent-ils défiler chez les arabes ? Non ! Le Dieu d’Israël d’autrefois, c’est l’Éternel qu’ont prêché les saints prophètes mais le dieu d’Israël aujourd’hui, c’est l’Amérique ! Et ce n’est pas à moi de leur dire cela, c’est pourquoi Dieu leur envoie Élie et Moïse avec un Message de jugement et de condamnation ! [Ndr : L’assemblée dit : « Amen ! »]."}, {"n": 6, "lari": "Bien! bo a ma nima ma malongi mu mystère ya ivraie, tweka na bi busi bi tanu ba télé ma tieléka bwéni ti, mbala bé ko ba lembo ba bakala bawu! kaba tamio ko ku ba bakala bawu mpe kaba mfungula mioko ku baptême! fallait Nzambi ka nzonza kati ba ningana mu fungula mio. tiangu mweni ti nfungulu masumu bata ya mbongélé buna bu fwanakané ko. Bantu ba ta nfungula kwa mu sa sulagé ti muntu tia wu. ka ba nfungula ma sumu ko bungu ti Danieli 12 télé ti ba fwéni bwa sa ngati ba sukuka ,ka ni bo ba tnasa mu sa lémbésa ti muntu tia wu. kwena na masumu ma tu nfungulaka na matu swéka. ka zabeno ti mpe lukuenda ka ku zulu na masumu mo ma lukala mu fungula mo béno béni. Nzambi mboka sa letu lu fwa lwa lubaka na masumu me lu ta lombo zolo mu fungula. Lwena libre mu lombo ma nfungula ka kalu kwena ku zulu ko na mawu. Mu ntangu i, béno ba nkunzi, ntala ba nfungudi mo, ka luta di: <<oh nkunzi Philippe,mpasi, kwena a mbuk'ani ko , mpasi mu lenvokela ti mbusi,..", "fr": "Bien ! Toujours après la prédication sur le mystère de l’ivraie, cela fait maintenant cinq Sœurs qui ont avoué qu’en réalité, tel enfant n’est pas celui de leur mari ! Elles n’ont jamais dit cela à leur mari et elles n’ont même pas confessé cela au baptême ! Il fallait que Dieu en parle et qu’elles en soient troublées avant de le confesser. Et j’en suis venu à la conclusion que la confession publique n’est pas prise comme il se doit. Des gens se confessent dans le but de soulager leur conscience. Ils ne confessent pas leurs péchés parce que Daniel 12 dit qu’ils doivent le faire pour être purifiés, blanchis et affinés mais ils le font dans le but de soulager leur conscience. Il y a donc des péchés qu’on confesse et d’autres qu’on ne confessera jamais si possible ! Mais sachez aussi que vous n’irez jamais au Ciel avec des péchés que vous avez refusé expressément de confesser. Et Dieu fera en sorte que la mort vous surprenne avec des péchés que vous avez refusé expressément de confesser. Vous êtes libre de ne pas les confesser mais vous n’irez pas au Ciel avec cela ! Maintenant, vous Frères, si elle le confesse, ne dites pas : « Oh Frère Philippe, c’est difficile, c’est parce que vous n’êtes pas à ma place, c’est difficile de pardonner à la Sœur, … »."}, {"n": 7, "lari": "Ba nkunzi, ka lumbongeladi wo mu faso ya tini, zolweno ti busi mpe na mwana wo wu lumbolo zaba samu wu léndi mwana Nzambi. Wu mweni? Mboko ku baptême mulongi fweni yula mi samu mio ku nkento na bakala mpe ti wumosi fungudi ti wa wuna pwanadi rama nima ma makwela ou sans ma kwela bobuke mu nzo ya bakala, nkazi to tibusi fweni baka baptême si wa fungula mpe wa baka mu lemvo WA pwanadi!", "fr": "Frères, ne le prenez pas en mal, aimez la Sœur et ce petit innocent qui peut être un enfant de Dieu. Vous voyez ? Et au baptême le pasteur doit demander ces choses aux couples et si l’un confesse qu’il a trompé l’autre après la dot ou même sans dot mais pendant qu’elle habitait dans sa maison, le Frère ou la Sœur ne peut recevoir le baptême que s’il a confessé et reçu le pardon de l’autre !"}, {"n": 8, "lari": "Di ni zu dia zingu tia mankululu ! Mio miamiaso mié luta wa mu mambundu ma ba mpélo, ngérozo, évangélique, na ba branhamiste, zena mbanzulu za bantu! Lu mweni ? Zena kwa nsalulu za bantu ! Nsalulu zo zi bandakene cri de minuit néti pasteur ya mu ndele ku Caroline du Nord ku États Unis,mfumu ya dimbu dia Amazing Grace Baptist Church c'est à dire di mbundu baptiste grâce infinie, wa ntati ma biblia meko ma fwanakané mu yoka ; kà I andi we na baptiste. Tima tia lombo sa ba mu nza ntété Cri de minuit ! Zena germes za imitation. Mu pasteur dio, biblia dia king James diena dia di mosi ku côté dia zu dia ba anglais ka ku kote ia ba Français, ka ntele mu samu kô ka mpele ko biblia dia king James mu français ka diena moko. Wa yoka mpé ma buku ma Billy Graham, Rick Warren, Jimmy Swaggart, Benny Hinn, Jean-Paul II et Benoît XVI... Sans ka ioka moma Tommy Osborn, Yonggi Cho mpe ba nkaka. Bio ni ti ? Ni imitation ! Kangu wu télé : Amen", "fr": "Ce sont ici les Paroles de la Vie éternelle ! Tout ce que vous entendez dans ces églises catholiques, protestantes, évangéliques et branhamistes, ce sont des imaginations d’hommes ! Vous voyez ? Ce sont des imitations ! Et l’imitation vient maintenant tout près du Cri de minuit au point qu’un pasteur blanc en Caroline du Nord aux États-Unis, président de l’église Amazing Grace Baptist Church c’est-à-dire l’église baptiste grâce infinie, a annoncé qu’il allait brûler des centaines de fausses versions de bible ; pourtant il est baptiste. Chose qui n’avait jamais eu lieu sur la terre avant le Cri de minuit ! Ce sont les germes de l’imitation. Pour ce pasteur, la version King James est la seule bible du côté de la langue anglaise mais du côté français, il ne dit rien alors que la version King James n’existe pas en français. Il a aussi brûlé les livres de Billy Graham, Rick Warren, Jimmy Swaggart, Benny Hinn, Jean-Paul II et Benoît XVI... sans brûler ceux de Tommy Osborn, Yonggi Cho et bien d’autres. Qu’est-ce que c’est ! C’est l’imitation ! [Ndr : L’assemblée dit : « Amen ! »]."}, {"n": 9, "lari": "Mpé kwena pasteur dia kaka ta longa ti ma biblia kwa ma King James, Louis Segond na Darby ména ma ma boté ma kaka mena ma nkuyu ma fwanakané ba ioka mo! Ntété wasa bo, fwanakané ka rana appel na commission andi, mpe mu tia luvé lwa Nzambi keri sa ka bo.[ Ndr: Di mbundu di télé : Amen]. Bio bia nso bi lembolo kwizila mu mbikudi ya moyo yo yi tambikidi Nzambi mu tangwa ku, zena nsalulu za Satana. Mpé ka lu landadi mio. Amen.", "fr": "Et il y a un autre pasteur qui prêche que seules les versions King James, Louis Segond et Darby sont bonnes et que tout le reste est du diable et doit être brûlé ! Mais avant de faire cela, il devait donner son appel et commission, et en vertu de quel mandat divin il était en train de faire cela. [Ndr : L’assemblée dit : « Amen ! »]. Tout ce qui ne vient pas du prophète messager vivant de votre temps, ce sont des distractions de Satan. Et cela ne doit pas vous distraire. Amen."}, {"n": 10, "lari": "Wu manisa, wénani na lusongela mwa tima mu: Osée 1: 4... Kalu fwena yidika ko misamu mio mi lombolo lu ntuma nzambi ! Lu léndi ba na nswa WA Nzambi mu sa tima. Seno wo ti bakuranini wo luvé. Nzambi iandi mbeni wa rana luvé mpe wa tambikidi Jéhu bweneti: <<... Bo wa sémba nzo ya Achab mboko bo ni baka kesi, mu menga ma bi sadi biani na bikudi zani na menga ma bi sadi biabia nsoni bia Éternel>>. Mpé Jehu wa tumamane kwe Nzambi mpé wa sadila mio ! Lu mweni ?", "fr": "Pour finir, je voudrais expliquer un passage : Osée 1 :4...Ne faites jamais ce que Dieu ne vous a pas demandé ! Vous pouvez avoir un droit divin de faire une chose. Faites-le s’il vous est permis de le faire. Dieu Lui-même avait mandaté et commissionné Jéhu disant : « … tu frapperas la maison d'Achab et je vengerai, le sang de mes serviteurs les prophètes et le sang de tous les serviteurs de l’Éternel ». Et Jéhu obéit à Dieu et fit ainsi ! Vous voyez ?"}, {"n": 11, "lari": "Tangeno 2 Rois mu ti kapu tia nvwa (9) na kumi(10) mpé mbo lumona ti Jehu wa téngama mu mio mia ntéla Nzambi. Lu télé :<< oh nkunzi Philippe, ni Nzambi iandi Béné wa mu tela ka sa bo tiangu mpé Bikudi Élie ka ta yandi mpé mbo kasa bo!>>. Ntambudi ! A mbo bwe lendi simbila Saül même ti wele mu nzila yi lombolo zolo Nzambi ? Léndi sungika bala ba mfumwa ku ti ku ntélé wo ka bunkuta mpé na ti mintu bungu ti bena bala ba mfumwa ku ! Ngabu I kwa ntambudi mi ntélé mfumwa ku, à défaut wa mulomba lemvo mu bungu dia bala bandi ba bakala !", "fr": "Lisez 2 Rois chapitre 9 et le chapitre 10 et vous verrez que Jéhu avait eu un débordement de zèle dans la mission que Dieu lui avait donnée. Vous dites : « Oh Frère Philippe, c’est Dieu Lui-même qui lui a dit de faire cela et même le prophète Élie a dit qu’il le ferait ! ». D’accord ! Mais, comment peux-tu porter la main sur Saül même s’il emprunte un chemin que Dieu n’a pas tracé ? Tu peux redresser les fils de ton maître s’il te le demande mais avec crainte et beaucoup de retenue parce que ce sont les fils de ton maître ! C’est à peine que tu obéis à ton maître, à défaut de lui demander pardon pour ses fils !"}, {"n": 12, "lari": "Or Jéhu wa mweni néti yandi takwe nwana na tsi ya ba ntantu mbandi bwa fwanakané ti lumbu, bò Nzambi bu kala mu kesi'andi , mboka kwénda mu nzo ya Jéhu mu fundisa mu misamu mio mia snoni mia mibi mio Jehu miaka yidika ku gâta dia Jizrël. Lu mweni ? Bo nzambi boka kala mu kesi'andi mpé wa mona Jizrël cité royale yi bwiri, télé : mo bwe Jehu ka lombolo tina mu yonda bantu bé mu nzo yati ti sadi Achab! Ba fioti na ba kula, lombolo ngamba na we ngamba, wa lunga na wu lombolo wa lunga>>?? Ni bo Nzambi ka mbambukidi Achab mpé Nzambi wa niongisi na wa semba nzo ya Jéhu!", "fr": "Or Jéhu avait agi comme s’il combattait une nation ennemie et il était évident qu’un jour, lorsque Dieu revient de sa colère, Il visite la maison de Jéhu pour faire payer tout le mal que Jéhu a fait à la cité de Jizreël. Vous voyez ? Quand Dieu revint de sa colère et vit Jizreël la cité royale renversée, Il dit : « Comment Jéhu n’a-t-il pas craint d’exterminer toute la maison de mon serviteur Achab ! Petits et grands, libres et esclaves, justes et injustes » ? Et Dieu se souvint d’Achab et Dieu fut affligé et frappa la maison de Jéhu !"}, {"n": 13, "lari": "Mbô Nzambi bweka ta ti ntuta israël bo kâ katuka ku ntoto'iandi mpé Yerusalem bo bamu barula néti mu situ, wa télé diaka ti : nge Israëli na mana ku yambidika tibakala tia ni tiaku diambidika ! Israëli ébu itata<< wakwelo kwe Nzambi>> kà israëli bamu katukidi ku toto'iandi pendant environ 2000 ans tété kâ kala mu mvu wa 1947 mu nzo 'iandi bo Nzambi ka mu bambudiki moyo. We na ma kutu mu wa, ka wé.", "fr": "Quand Dieu a dit que la rebelle Israël sera déportée de dessus sa terre et que Jérusalem sera labourée comme un champ, Il avait aussi dit: Toi Israël si je t’abandonne, que ma droite m’abandonne ! Israël signifie : « mariée à Dieu » mais Israël fut déportée de dessus sa terre pendant environ 2000 ans avant de revenir en 1947 dans sa propre patrie quand Dieu se souvint d’elle. Et que celui qui a des oreilles pour entendre, entende !"}]}, {"titre_lari": "Kacou 109 : Kalà épreuves ya ntangwaku", "titre_fr": "Refusant l'épreuve de son temps", "reference_fr": "Kc.109v6, Kc.109v7, Kc.109v12", "paragraphes": [{"n": 1, "lari": "Bien! biyuvu biole bié nani ra. Kiyuvu ka ntété kiéna ... nkudi Philippe; mu ntangu zazo nsoni, ba bikudi béri ba Juifs, bwé na bwé ndombi néti ngé weka bikudi? réponse yi ni yawu mu kivu tio : ba bikudi babansoni béri ba Hébreux ,mu bungu tsi, ntété, Yésu Christo wa toko kwenda ku bimémé bia zimbakana za nzo ya Israël tiangu Nzambi kéri nzoza kwa na ba Juifs mpé wa nzolé, kwizulwandi ya ntété yéri mu bungu dia ba Juifs mpé ni bo wa béla mpé bi landi baindi na ba tumwa béri kwa ba Juifs kà mu kwizulwandi ya zolé, yéri mu bungu dia nza yayonsoni. Tiangu ka ka tambikaka ba nzonzi mu toto wawansoni.", "fr": "Bien ! J’ai ici deux questions. La première question est … Frère Philippe, de tout temps, les prophètes ont été des Juifs, d’où vient-il qu’un Africain comme toi est prophète ? Et voici ma réponse à ce sujet : Tous les prophètes étaient des Hébreux parce que, premièrement, Jésus-Christ devait être envoyé aux brebis perdues de la maison d’Israël c’est pourquoi Dieu ne traitait qu’avec les Juifs et deuxièmement, sa première venue était pour les Juifs et cela fut ainsi et ses disciples et apôtres ne furent que des Juifs mais pour la seconde venue, c’était pour toutes les nations de la terre. C’est pourquoi Il suscite des messagers des quatre coins de la terre."}, {"n": 3, "lari": "Bien, muntu wa nsonékéna mu ku diula: ngana wéna bikudi ya kula to bikudi ya bisadi mu Ephésiens 4: 11? Mpé wata ta ti: wa manata ti wena bikudi ya Ephésiens 4: 11, wena mu samu ko kà wa mana ta ti wena bikudi ya kulu néti Moïse, Esaïe, Jérémie... buna wena bikudi ya mbaki! . Lu mweni? na mu ntéla ti: wéno misamu mi nta dukisa! ti zéna za bikudi ya éphésiens buna ni bo jiéna kà ti zéna za bikudi ya kula buna diéna bikudi néti Moïse, Esaïe to Jérémie.", "fr": "Bien, quelqu’un m’a écrit disant : « Es-tu prophète majeur ou un prophète parmi les ministères d’Éphésiens 4 :11 ? Et il a dit : Si tu dis que tu es un prophète éphésien, il n'y a pas de problème mais si tu dis que tu es un prophète majeur comme Moïse, Ésaïe, Jérémie... alors tu es un faux prophète ! ». Vous voyez ? Je lui ai répondu disant : Écoutez les Paroles que je dis ! Si elles sont celles d'un prophète éphésien alors je le suis mais si elles sont celles d’un prophète majeur comme Moïse, Ésaïe ou Jérémie alors je suis un prophète messager comme Moïse, Ésaïe ou Jérémie."}, {"n": 4, "lari": "bo bona batika mu longa, Emmanuel, pasteur branhamiste di mosi ku Abobo wata ku nkudi Christophe :<< ka mana ta ti wena mbikudi ya kula néti Moïse, Esaïe, Jérémie... buna tu wisana nandi ko kà ka mana ta ti wena mbikudi ya éphésien, mbo tumu télé ki ka longa ku...>>.", "fr": "Lorsque je commençais à prêcher, alors Emmanuel, un pasteur branhamiste à Abobo a dit au Frère Christophe : « S'il dit qu'il est un prophète majeur comme Moïse, Ésaïe, Jérémie ... alors nous sommes en désaccord avec lui mais s'il dit qu'il est un prophète éphésien, nous l'inviterons à venir prêcher ici … »."}, {"n": 5, "lari": "Bubu Mvutulu kala ra tivu tia kaka: nkudi Philippe, ku lwendi lwata ji perruques néti William Branham? Mbala kumi, Baku judidi tivu tio. Ntété, Perruques mpé na tissages, lu lendi za lwata ti tisalu we mpe ti ni bo tamata bungu ti William Branham yaka lwata. Kà ti William Branham kalu telelako ti Perruques ka lweti, kalu sa wa zaba ko. Mpé ndombele ti wu fweni Béla buna na swa wa pasteur aku to mu bungu dia maladi. Ni mu yika kwa nsuki ni bo ji fwana ba na couleur za kaka ko to za tulu ni mu ma rembo mpe fwena za kanga ko.", "fr": "Maintenant j’en viens à une autre question : Frère Philippe, pouvons-nous porter les perruques comme William Branham ? Plus de dix fois, cette question m’a été posée. D’abord, les perruques et les tissages, vous pouvez en porter si cela est vraiment nécessaire et je le dis parce que William Branham en a porté. Mais si William Branham ne vous dit pas qu'il a porté une perruque, vous ne le saurez pas. Et je demande que cela soit fait ainsi avec l'accord de votre pasteur ou dans un cas de santé. C'est tout juste pour faire office de chevelure donc cela ne peut pas être de couleurs différentes ou descendre sur les épaules ni être tressé."}, {"n": 6, "lari": "Mpé mpila mosi kwa, bo bunita zonzela masola malu lendi lombo lwata, binkuti biba lwata nita zonzela. Mo fripperies mo, mwena binkuti bie ba toko lwata bieba ta vutu teka, ni bio lu lendi lombo lwata. Kà nta nzonzela payepaye ko, bikuti biba lombolo lwata ni biba bia friperie. Mbongele exemple : mo ji friperie mo, mwena na bikuti na bima biéba lombo lwata, bima biéba lembana mu téka to bia sadila. Lu léndi bia lwata, ka biobiako ninta nzonzole.", "fr": "Et dans le même sens, lorsque je parle de friperies que vous ne devez pas porter, je parle des habits déjà portés. Parmi ces friperies, il y a des habits déjà portés qui sont revendus, ce sont ces habits que vous ne devez pas porter. Je ne parlais donc pas de soldes, des habits non portés même si c'est de la friperie. Je reprends l’explication : Dans ces friperies, il y a des vêtements et objets jamais portés, des choses qui peut-être n’ont pas pu être vendues ou qui sont des fins de série. Vous pouvez les porter, ce n’est pas de cela que je parle."}, {"n": 7, "lari": "Mvutulu bonga kiyuvu kia kaka: nkudi Philippe, batata bani wenawu na ba landa ku dimbu diawu. Mpé yi ni mvutu : lu fwena kwénda ko kà bamana lu ntuntasa, yendeno na Mpeve ya Message. Mpé exemple mu Tangu ya lusanbulu, sambileno mpé téno:<<Oh Mfumu Yisu, Nzambi ya Kacou Philippe, mazono, bwe Jiedi kwiza ku, mbelolo zazi bi za banani néti bantu ba mu dimbu di, bwe Jiedi sa ébu na ébu kà bubu na sala bwa seko bungu wa ntambika mBikudi aku ya santu Kacou Philippe... Oh Yésu Christo, wenawu ndisa mu dimbu di mu mu nkento mweka lendi telema ku mtu mu longa babakala>>. Lu mweni ?", "fr": "J’en viens encore à une autre question : Frère Philippe, mes parents m’obligent à les suivre dans leur église. Et voici la réponse : Vous ne devez pas y aller mais s’ils vous obligent, allez-y avec l’esprit du Message. Et par exemple au moment de prier, élevez la voix et dites : « Oh Seigneur Jésus, Dieu de Kacou Philippe, autrefois, quand je venais ici, je vivais mal comme les gens de cette église, je faisais ceci et cela mais maintenant je ne le fais plus parce que tu as envoyé ton saint prophète Kacou Philippe… Oh Jésus-Christ, on veut que je vienne dans cette église où une femme en menstrues peut monter en chaire pour prêcher devant les hommes ». Vous voyez ?"}, {"n": 9, "lari": "bubu bala ba Nzambi ba zebi ti Biblia tiena kwa buku dia ntama mpé dia dingila. Diena mvukananu ya mabuku ma ntama ma ba Mfumu za Israël mpé na ba mbikudi Nzambi zeka ntambika mu bungu dia Mvukulu za mimvu mia yoka. Biblia diena mu babukila moyo mpe kimbangi mu mio Nzambi mieka yidika mu ntama. Diena neo Mpe kwena kumako, ba télé ti mvukulu ni mo ye.", "fr": "Désormais les enfants de Dieu savent que la Bible n’est qu’un document d’histoire et de recherche. C’est l’assemblage des livres de l’histoire des rois d’Israël et des prophètes que Dieu avait envoyés pour le Salut des générations passées. La Bible est un mémorial et un témoignage de ce que Dieu avait fait dans le passé. C’est un musée et nulle part, il n’est dit que le Salut s’y trouve."}, {"n": 10, "lari": "au contraire, mu Jean 5:39, Yésu wata ku ba tata beno ba pharisiens, bilawuki bia mu ntangwandi :<< lu ta sola bi ntsono, lu mweni ti ni mo lubakila lu Zingu lwa mankululu...>>. Biblia diena buku dia ntama, lu mbanza mu baka lu Zingu lwa mankululu, yo ni leçon yi mbongele ya ti lawuki ti ta fiela ra Zala. [Ndr: Di bundu di télé : <<Amen!>>].", "fr": "Au contraire, dans Jean 5 :39, Jésus a dit à vos pères les pharisiens, les fous de son temps : « Vous sondez les écritures, car vous espérez avoir la Vie éternelle en elles... ». La Bible est un livre d’histoire et quelqu’un qui fouille dans un livre d’histoire, espérant y trouver la Vie éternelle, c’est la leçon que je tire du fou qui fouille dans la poubelle.[Ndr : L’assemblée dit : « Amen !»]."}, {"n": 11, "lari": "kumbu ya Biblia yi zololo ta nzo yaba lundila ma buku. Yena mu sens féminin- pluriel néti<<annales>>. Soixante six mabuku mô ma Biblia mena mô meba sisa, mena soixante six mabuku ya misamu miaba Yuda mpé naba chrétiens! Lu mweni ? Biblia diena kwa dia mboté mu mbikululu néti ni mu Matthieu 25 :6 mu katikati dia Afrique Yaba ndombi, Mbô ku wakana Zu!", "fr": "Le mot Bible signifie bibliothèque. C’est un mot au sens féminin-pluriel comme « annales ». Les soixante-six livres de la Bible sont des archives, ce sont soixante-six documents du musée des civilisations judaïques et chrétiennes ! Vous voyez ? La Bible n’est utile que pour son côté prophétique qui dit par exemple dans Matthieu 25 :6 que du milieu de l’Afrique noire, il y aura un Cri !"}, {"n": 12, "lari": "bubu, lu ntambudi ti zu di wakane mu Ésaïe 40:3 wena Jean Baptiste néti bu télé Matthieu 3:3 , Marc 1:3... Mpé kalu nta ntambula ko ti djiena accomplissement ya Matthieu 25 :6 tiangu muti wa dukidia ku ntsabeno ko? Muti wa dukidi ku Côte d'Ivoire kà bi ntala biandi mpé miandi miandi miena mu ntoto ti wa mvimba. Luku ndonsele ka ni bo diena. [Ndr: Di bundu di télé : <<Amen !>>].", "fr": "Aujourd’hui, vous acceptez que la voix qui crie dans Ésaïe 40 :3 est Jean Baptiste comme le dit Matthieu 3 :3, Marc 1 :3... et vous n’acceptez pas que je suis l’accomplissement de Matthieu 25 :6 parce que l’arbre n’a pas poussé dans votre jardin ? L'arbre a poussé en Côte d'Ivoire mais ses branches et ses racines sont dans tous les pays de la terre. Vous me rejetez et pourtant c’est ce que je suis ! [Ndr : L’assemblée dit : « Amen ! »]."}, {"n": 13, "lari": "Bu tiweno ti ngana ti tia mazulu. Buta yi mosi yi kwanga miti weri na mwana wu mosi weri sa mayela ku lukolo mpe Keri rana tata diandi ngolo mu ti salu tiandi. Padi ti mosi, Mfumu ya kulo wiji zonza ku bala balukolo télé : << bala balukolo, ntamana kizamin za lukolo mpe lu léndia lenda kani ma buku ma ntama. Kà tu mwini ti na buku mo, Mbô luzaba misamu mia mvu za yoka ntété béno mpe Mbô luba na mayela ma mingu ti lumbu tia kizamin >>.", "fr": "Maintenant écoutez cette parabole du Royaume des Cieux. Un vieux bûcheron avait un fils unique qui était bon à l'école et cela consolait et fortifiait son père devant ses durs labeurs de bûcheron. Un matin, le directeur de l'école est venu parler aux élèves disant : « Chers élèves, bientôt ce sont les examens scolaires et vous pouvez y réussir sans les annales. Mais nous avons jugé qu'avec les annales, vous aurez une idée des épreuves que les générations d'avant vous ont eues et vous serez beaucoup plus brillants à l'examen »."}, {"n": 14, "lari": "Mpe Mfumu ya lukolo wa dukisa buku mpe wa ta ku bala balukolo : << buku di diena na exercice za kizamin za ntama. Diena mvukananu ya mabuku ma mingi. Mpe konso buku diena na misamu mia mvula ya yoka . Neti, chapitre 10 yena misamu mia 1975 mpe corrections zandi. Mpe misamu mia 1975 mie mia swasana na mia 1976 mpe misamu mia 1976 mie mia swasana na misamu mia 19777...>>. Mpe ra manima ma explications za mfumu ya lukolo, mabuku ba reni mo ku mwana wa MButa yo mpe ku bala baka balukolo.", "fr": "Puis le directeur sortit un livre et dit aux élèves : « Ce livre contient les annales des examens et concours. Il est l’assemblage de plusieurs livres. Et chaque livre contient les épreuves d'une année précise et ses corrections. Par exemple, le chapitre 10 contient les épreuves de 1975 et ses corrections. Et les épreuves de 1975 sont différentes des épreuves de 1976 et les épreuves de 1976 sont différentes des épreuves de 1977 ... ». Et après les explications du directeur, les annales furent données au fils du bûcheron et aux autres élèves."}, {"n": 15, "lari": "kà buna ti lumbu tia kizamin tia tudidi, mwana wa mbuta yo kadidi mu kwénda mu yokesa kizamin tia ntangwandi. Wa télé :<< Ti mio mie mu buku di miena miatiéleka mpe mia rana kizamin kwe ba kuluntu béto, mu bungu dia ti lu lombo baka kizamin balamosi ti ntomo bia sala ??>>. Mpe ma longi mànà ka sobesa mwana ya mbuta ko Mpe ba ta ku tatandi ka munata ku Muntu tala misamu mia mutu. Wena makutu muwa kawe.", "fr": "Mais quand le jour de l'examen arriva, le fils du bûcheron refusa de se présenter à l'épreuve de son temps. Il disait : « Si les épreuves qui sont dans ce livre sont authentiques et ont permis à nos aînés d'avoir leur examen, pourquoi je ne peux pas avoir le diplôme directement si je les résous correctement ?». Et toutes les explications n'ont pas pu ramener le fils du bûcheron à la raison et il a été demandé que son père l'emmène chez un psychiatre. Que celui qui a des oreilles pour entendre entende !"}]}], "verbes": [{"lari": "baka", "fr": "obtenir · avoir"}, {"lari": "batika", "fr": "commencer"}, {"lari": "bika", "fr": "laisser · cesser", "pp": ["bikidi"]}, {"lari": "bonga", "fr": "prendre", "pp": ["bongele"]}, {"lari": "bula", "fr": "casser"}, {"lari": "buta", "fr": "engendrer"}, {"lari": "butuka", "fr": "naître"}, {"lari": "bvukisa", "fr": "mélanger"}, {"lari": "bwa", "fr": "plonger · tomber"}, {"lari": "bénda", "fr": "tirer"}, {"lari": "defa", "fr": "devoir", "pp": ["defele"]}, {"lari": "dia", "fr": "manger", "pp": ["diidi"]}, {"lari": "djioka", "fr": "s'enfuir", "pp": ["djiokele"]}, {"lari": "duka", "fr": "saigner"}, {"lari": "dukisa", "fr": "fabriquer · fonder"}, {"lari": "dumuka", "fr": "sauter"}, {"lari": "défisa", "fr": "prêter"}, {"lari": "fila", "fr": "accompagner"}, {"lari": "fonda", "fr": "fabriquer · fonder"}, {"lari": "fua", "fr": "coûter", "pp": ["fuidi"]}, {"lari": "f const TR = { fr: null, la: null };
const keyOf = s => (norm(s).match(/[\p{L}\p{N}]+/gu) || []).join(" ");

function pairsOf(fr, la) {
  const f = cleanForm(fr), l = cleanForm(la), fs = f.split("/"), ls = l.split("/");
  if (fs.length > 1 && fs.length === ls.length) return fs.map((x, i) => [x.trim(), ls[i].trim()]);
  const pm = f.match(/^(il|ils|tu|vous|nous|je)\/(elle|elles|on|il|ils)\s+(.+)$/i);
  if (pm && ls.length === 1) return [[pm[1] + " " + pm[3], l], [pm[2] + " " + pm[3], l]];
  return [[f.replace(/\//g, " ou "), l.replace(/\//g, " ou ")]];
}
const ARTICLES = new Set(["le", "la", "les", "l", "un", "une", "des", "du", "de", "d"]);
function buildIdx(d) {
  const m = new Map(), weak = [];

    if (!k || !tr) return;
    const cur = m.get(k);
    if (!cur) m.set(k, { tr: [tr], full: [full], src: src });
    else if (!isWeak && !cur.tr.includes(tr)) { cur.tr.push(tr); cur.full.push(full); }
  };
  ALL.forEach(e => pairsOf(e.fr, e.lari).forEach(([f, l]) => {
    const fv = splitAlt(f), lv = splitAlt(l);
    if (!fv.length || !lv.length) return;
    if (d === "fr") {
      fv.forEach(v => {
        const k = keyOf(v); add(k, lv[0], lv.join(" / "), v);
        const tk = k.split(" "); while (tk.length > 1 && ARTICLES.has(tk[0])) tk.shift();
        if (tk.join(" ") !== k) weak.push([tk.join(" "), lv[0], lv.join(" / "), v]);
      });
    } else {
      lv.forEach(v => add(keyOf(v), fv[0], fv.join(" / "), v));
    }
  }));
  weak.forEach(w => add(w[0], w[1], w[2], w[3], true));

}

  pouvoir: [["peux", "peux", "peut", "pouvons", "pouvez", "peuvent"], "pourr", "pouv", "pu"],

  peser: [["pèse", "pèses", "pèse", "pesons", "pesez", "pèsent"], "pèser", "pes", "pesé"],
  "élever": [["élève", "élèves", "élève", "élevons", "élevez", "élèvent"], "élèver", "élev", "élevé"]

const IR_REG = ["finir", "choisir", "grandir", "bâtir"];
const AUX = ["ai", "as", "a", "avons", "avez", "ont"], SUBJ = ["je", "tu", "il", "nous", "vous", "ils"];
function frForms(inf) {
  let pres, fut, imp, pp, ps = null;
  const soft = (s, nx) => (s.endsWith("g") && /^[aoâ]/.test(nx)) ? s + "e" : (s.endsWith("c") && /^[aoâ]/.test(nx)) ? s.slice(0, -1) + "ç" : s;
  if (FR_IRR[inf]) {
    const x = FR_IRR[inf]; pres = x[0]; fut = ["ai", "as", "a", "ons", "ez", "ont"].map(e => x[1] + e); pp = x[3];
    imp = ["ais", "ais", "ait", "ions", "iez", "aient"].map(e => soft(x[2], e) + e);
  } else if (inf.endsWith("er")) {
    const s = inf.slice(0, -2);
    pres = ["e", "es", "e", "ons", "ez", "ent"].map(e => soft(s, e) + e);
    fut = ["ai", "as", "a", "ons", "ez", "ont"].map(e => inf + e);
    imp = ["ais", "ais", "ait", "ions", "iez", "aient"].map(e => soft(s, e) + e);
    pp = s + "é";
    ps = ["ai", "as", "a", "âmes", "âtes", "èrent"].map(e => soft(s, e) + e);
  } else if (inf.endsWith("ir") && IR_REG.includes(inf)) {
    const s = inf.slice(0, -2);

    fut = ["ai", "as", "a", "ons", "ez", "ont"].map(e => inf + e);

    pp = s + "i";

    const s = inf.slice(0, -2);

    fut = ["ai", "as", "a", "ons", "ez", "ont"].map(e => s + "r" + e);
    imp = ["ais", "ais", "ait", "ions", "iez", "aient"].map(e => s + e);

let FRV = null;
function buildFRV() {
  FRV = new Map();

    m = m.trim(); if (/^[a-zàâçéèêëîïôûùüÿœ]+$/.test(m) && /(er|ir|re)$/.test(m)) { if (!infs.has(m)) infs.set(m, []); infs.get(m).push(v); }
  }));

    const k = norm(key); let e = FRV.get(k);

    if (!e.tr.includes(lari)) { e.tr.push(lari); }
  };
  infs.forEach((vlist, inf) => {
    const f = frForms(inf); if (!f) return;
    vlist.forEach(v => {
      const V = v.lari, lab = " (" + "forme conjuguée de « " + inf + " »)";
      const P = ["ni ta", "ta", "kata", "tuta", "luta", "bata"], F = ["ni", "wa", "ka", "tu", "lu", "ba"];
      const PS = ["na", "wa", "ka", "twa", "lwa", "ba"], IM = ["mbele", "bele", "kabele", "tubele", "lubele", "babele"];
      const PC = ["na", "wa", "ka", "tu", "lu", "ba"];
      for (let i = 0; i < 6; i++) {
        const subs = i === 2 ? ["il", "elle", "on"] : i === 5 ? ["ils", "elles"] : [SUBJ[i]];
        subs.forEach(sj => {
          const sjs = sj === "je" ? ["je"] : [sj];
          if (sj === "je" && /^[aeiouyàâéèêëîïôûhœ]/i.test(f.pres[0])) add("j " + f.pres[0], V + " " + P[0] + " " + V, "présent");
          add(sj + " " + f.pres[i], V + " " + P[i] + " " + V, "présent");
          if (sj === "je" && /^[aeiouyàâéèêëîïôûhœ]/i.test(f.pres[0])) { }
          add(sj + " " + f.fut[i], "mbo " + F[i] + " " + V, "futur");
          add(sj + " " + f.imp[i], V + " " + IM[i] + " " + V, "imparfait");
          if (f.ps) add(sj + " " + f.ps[i], PS[i] + " " + V, "passé simple");
          if (v.pp) {
            const pc = PC[i] + " " + v.pp[0];
            if (sj === "je") add("j " + AUX[0] + " " + f.pp, pc, "passé composé");
            else add(sj + " " + AUX[i] + " " + f.pp, pc, "passé composé");

}
function tokenize(text) {

  while ((m = re.exec(text))) {
    if (m.index > last) parts.push({ s: text.slice(last, m.index) });
    parts.push({ w: m[0], n: norm(m[0]) }); last = re.lastIndex;
  }

}
function translate(text) {
  const d = S.dir; if (!TR[d]) TR[d] = buildIdx(d);
  const idx = TR[d], parts = tokenize(text), wi = [];
  parts.forEach((p, i) => { if (p.w !== undefined) wi.push(i); });
  const groups = new Map(), miss = [], detail = new Map();
  let found = 0, total = 0, i = 0;
  while (i < wi.length) {
    let hit = null;
    const start0 = wi[i];
    for (let L = Math.min(7, wi.length - i); L >= 1 && !hit; L--) {
      let ok = true;
      for (let k = i; k < i + L - 1; k++) {
        const between = parts.slice(wi[k] + 1, wi[k + 1]).map(p => p.s).join("");
        if (/[.!?;:\n…]/.test(between)) { ok = false; break; }
      }
      if (!ok) continue;
      const key = wi.slice(i, i + L).map(j => parts[j].n).join(" ");
      if (d === "fr" && !FRV) buildFRV();
      const fe = d === "fr" ? FRV.get(key) : null;
      const e = fe ? { tr: fe.tr, full: [fe.tr.join(" ; ") + " — " + fe.label] } : idx.get(key);
      if (e && d === "fr" && L === 1 && key === "a" && parts[start0].w.toLowerCase() !== "à") continue;
      if (e) hit = { L: L, e: e };
    }
    const start = wi[i];
    if (hit) {
      const end = wi[i + hit.L - 1];
      const srcText = parts.slice(start, end + 1).map(p => p.s !== undefined ? p.s : p.w).join("");
      groups.set(start, { end: end, item: { kind: "tr", t: hit.e.tr[0], all: hit.e.full.join(" ; ") } });
      if (!detail.has(srcText.toLowerCase())) detail.set(srcText.toLowerCase(), { src: srcText, tr: hit.e.full.join(" ; "), n: hit.L });

    } else {

      else { total++; if (!miss.includes(w.toLowerCase())) miss.push(w.toLowerCase()); groups.set(start, { end: start, item: { kind: "miss", t: w } }); }

      else {
        dropSep = false;
        if (it.kind === "tr") { html += `<span class="trw" title="${esc(it.all)}">${esc(it.t)}</span>`; plain += it.t; }
        else { html += `<span class="miss">${esc(it.t)}</span>`; plain += "[" + it.t + "]"; }
      }
      p = g.end + 1; continue;
    }

const PRON = ["je", "tu", "il/elle", "nous", "vous", "ils/elles"];
function conjuguer(v, pp) {
  const p = ["ni", "wa", "ka", "tu", "lu", "ba"];
  return [
    ["Présent", [v + " ni ta " + v, v + " ta " + v, v + " kata " + v, v + " tuta " + v, v + " luta " + v, v + " bata " + v]],
    ["Futur simple", p.map(x => "mbo " + x + " " + v)],
    ["Passé simple", ["na", "wa", "ka", "twa", "lwa", "ba"].map(x => x + " " + v)],
    ["Imparfait", ["mbele", "bele", "kabele", "tubele", "lubele", "babele"].map(x => v + " " + x + " " + v)]
  ].concat(pp ? [["Passé composé", p.map(x => ({ ni: "na" }[x] || x)).map(x => x + " " + pp.join(" ou "))]] : []);
}

}

function render() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.toggleAttribute("aria-current", b.dataset.v === S.tab) || b.removeAttribute("aria-current"));
  document.querySelectorAll("nav.tabs button").forEach(b => { if (b.dataset.v === S.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  ({ trad: renderTraduire, mots: renderMots, fiches: renderFiches, quiz: renderQuiz, textes: renderTextes, gram: renderGram, prop: renderProp })[S.tab]();
}

document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act, v = t.dataset.v, f = S.fc, z = S.qz;
  if (a === "trcopy" || a === "misscopy") { copyText(a === "trcopy" ? S.lastTr : S.lastMiss.join("\n"), t); return; }
  if (a === "tab") { S.tab = v; window.scrollTo(0, 0); }
  else if (a === "prop") { S.prev = S.tab === "prop" ? S.prev : S.tab; S.prop.msg = ""; const w = t.dataset.from === "q" ? S.q : t.dataset.from === "miss" ? S.lastMiss.join(", ") : ""; if (w) { if (S.dir === "fr") S.prop.fr = w; else S.prop.lari = w; } S.tab = "prop"; window.scrollTo(0, 0); }
  else if (a === "pback") { S.tab = S.prev || "trad"; window.scrollTo(0, 0); }
  else if (a === "psend") { sendProp(); }
  else if (a === "hits") { S.hitsOpen = !S.hitsOpen; }
  else if (a === "tgo") { S.tab = "textes"; S.tx.open = +t.dataset.ti; S.tx.shown = {}; S.tx.shown[t.dataset.n] = true; S.tx.focus = t.dataset.n; }
  else if (a === "topen") { S.tx.open = +v; S.tx.shown = {}; window.scrollTo(0, 0); }
  else if (a === "tback") { S.tx.open = null; window.scrollTo(0, 0); }
  else if (a === "tpar") { S.tx.shown[v] = !S.tx.shown[v]; }
  else if (a === "tall") { const ps = DATA.textes[S.tx.open].paragraphes; const all = ps.every(p => S.tx.shown[p.n]); ps.forEach(p => { S.tx.shown[p.n] = !all; }); }
  else if (a === "dir") { S.dir = v; if (S.qz) { S.qz.opts = null; S.qz.picked = null; } }
  else if (a === "cat") { S.cat = v; }
  else if (a === "flip") { f.flip = !f.flip; }
  else if (a === "know") { const e = f.deck[f.i]; store.known[e.id] = 1; save(); if (!e.retry) f.got++; f.i++; f.flip = false; }
  else if (a === "again") { const e = f.deck[f.i]; delete store.known[e.id]; save(); f.deck.push(Object.assign({}, e, { retry: true })); f.i++; f.flip = false; }
  else if (a === "fcRestart") { startFc(); }
  else if (a === "resetKnown") { store.known = {}; save(); S.fcScope = ""; startFc(); }
  else if (a === "pick") { if (z.picked === null) { z.picked = +t.dataset.k; if (z.opts[z.picked] === dst(z.qs[z.i])) z.score++; } }
  else if (a === "next") { z.i++; z.picked = null; z.opts = null; }
  else if (a === "qzRestart") { startQz(); }
  render();
  if (S.tx.focus) { const el = document.getElementById("p" + S.tx.focus); S.tx.focus = null; if (el) el.scrollIntoView(); }
});
document.addEventListener("input", ev => {
  if (ev.target.id === "q") { S.q = ev.target.value; S.hitsOpen = false; refreshList(); }
  if (ev.target.id && ev.target.id.startsWith("pp_")) { S.prop[ev.target.id.slice(3)] = ev.target.value; }
  if (ev.target.id === "trIn") { S.trText = ev.target.value; updateTr(); }
});
document.addEventListener("change", ev => {
  if (ev.target.id === "fcScope") { S.fcScope = ev.target.value; startFc(); render(); }
  if (ev.target.id === "cjVerb") { S.verbe = ev.target.value; render(); }
  if (ev.target.id === "qzScope") { S.qzScope = ev.target.value; startQz(); render(); }
});
render(); flushQueue();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
</body>
</html>
