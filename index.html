<style>
/* Layout: une colonne mobile, navigation fixe en bas, quatre modes (mots, fiches, quiz, grammaire). */
:root {
  --bg: #f1f4ef;
  --surface: #ffffff;
  --fg: #12251d;
  --muted: #5b6e64;
  --line: #d6ddd5;
  --accent: #1c7a4b;
  --accent-ink: #ffffff;
  --sun: #f0b323;
  --ok: #1c7a4b;
  --bad: #b8372b;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1a15; --surface: #16261f; --fg: #e6efe9; --muted: #93a79c; --line: #284034;
    --accent: #4fc487; --accent-ink: #062416; --sun: #f3c24a; --ok: #4fc487; --bad: #ee7a6c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1a15; --surface: #16261f; --fg: #e6efe9; --muted: #93a79c; --line: #284034;
  --accent: #4fc487; --accent-ink: #062416; --sun: #f3c24a; --ok: #4fc487; --bad: #ee7a6c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-block: 0 88px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header.top { padding-top: 20px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 2.1rem; line-height: 1; margin: 0; letter-spacing: -0.02em; }
h1 span { color: var(--accent); }
.brand { display: flex; align-items: center; gap: 12px; }
.logo { width: 56px; height: 56px; flex: none; }
.sub { color: var(--muted); font-size: 0.9rem; }
.stripe { height: 5px; border-radius: 3px; background: linear-gradient(90deg, var(--accent) 0 34%, var(--sun) 34% 67%, var(--bad) 67% 100%); }
h2 { font-family: var(--font-display); font-size: 1.25rem; margin: 0; text-wrap: balance; }
h3 { font-family: var(--font-display); font-size: 1rem; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.field {
  width: 100%; padding: 12px 14px; font: inherit; color: var(--fg);
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px;
}
select.field { appearance: auto; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 9px 14px; font-weight: 700; font-size: 0.9rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip { flex: none; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 0.85rem; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.count { color: var(--muted); font-size: 0.85rem; }
.group { font-family: var(--font-display); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); margin: 10px 0 2px; }
.entry { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; display: flex; flex-direction: column; gap: 2px; }
.entry + .entry { margin-top: 6px; }
.entry .a { font-size: 0.9rem; color: var(--muted); overflow-wrap: anywhere; }
.entry .b { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; color: var(--fg); overflow-wrap: anywhere; }
.entry .b.is-lari { color: var(--accent); }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
/* fiches */
.card {
  width: 100%; min-height: 220px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px;
  padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center;
  box-shadow: 0 6px 0 var(--line);
}
.card .tag { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.card .big { font-family: var(--font-display); font-weight: 800; font-size: 1.9rem; line-height: 1.15; overflow-wrap: anywhere; text-wrap: balance; }
.card .big.is-lari { color: var(--accent); }
.card .hint { color: var(--muted); font-size: 0.85rem; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.btn { border: 0; border-radius: 10px; padding: 12px 18px; font-weight: 700; background: var(--accent); color: var(--accent-ink); }
.btn.alt { background: var(--surface); color: var(--fg); border: 1.5px solid var(--line); }
.btn.bad { background: var(--bad); color: #fff; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btns .full { grid-column: 1 / -1; }
/* quiz */
.opts { display: grid; gap: 8px; }
.opt { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 13px 14px; font-weight: 700; overflow-wrap: anywhere; }
.opt.good { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 16%, var(--surface)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--surface)); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.q { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; overflow-wrap: anywhere; text-wrap: balance; }
.score { font-family: var(--font-display); font-size: 3rem; font-weight: 800; color: var(--accent); }
mark { background: color-mix(in srgb, var(--sun) 55%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }
.hit { line-height: 1.5; overflow-wrap: anywhere; }
.lg { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); margin-right: 6px; }
.entry .tog { margin-top: 6px; }
.trout { font-size: 1.1rem; line-height: 1.75; overflow-wrap: anywhere; }
.trw { color: var(--accent); font-weight: 700; }
.miss { color: var(--muted); border-bottom: 2px dotted var(--bad); }
.note { color: var(--muted); font-size: 0.85rem; line-height: 1.5; }
.wrapchips { display: flex; flex-wrap: wrap; gap: 6px; }
details.panel summary { cursor: pointer; font-weight: 700; }
textarea.field { resize: vertical; font-family: var(--font-body); line-height: 1.5; }
/* textes */
.textcard { text-align: left; display: flex; flex-direction: column; gap: 4px; width: 100%; }
.is-lari-txt { color: var(--accent); font-family: var(--font-display); font-weight: 600; }
.para { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.pn { align-self: flex-start; font-family: var(--font-display); font-weight: 800; font-size: 0.8rem; color: var(--accent-ink); background: var(--accent); border-radius: 999px; padding: 1px 9px; }
.lt { margin: 0; font-size: 1.05rem; line-height: 1.65; overflow-wrap: anywhere; }
.ft { margin: 0; padding: 10px 12px; background: var(--bg); border-left: 4px solid var(--sun); border-radius: 6px; line-height: 1.6; overflow-wrap: anywhere; }
.tog { align-self: flex-start; border: 1.5px solid var(--line); background: transparent; border-radius: 8px; padding: 6px 12px; font-size: 0.85rem; font-weight: 700; color: var(--accent); }
/* grammaire */
.gr { display: grid; gap: 10px; }
.cls { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: baseline; }
.pre { font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; color: var(--accent); }
.ex { background: var(--bg); border-radius: 8px; padding: 8px 10px; }
.ex b { color: var(--accent); }
.det { color: var(--muted); font-size: 0.85rem; }
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(6, 1fr);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
nav.tabs button { border: 0; background: transparent; padding: 10px 2px; border-radius: 10px; font-weight: 700; font-size: 0.72rem; color: var(--muted); }
nav.tabs button[aria-current="page"] { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .25s; } }
</style>

etail": "mukunga = une chanson · tu ta = nous · tanga = chante"}]}, {"titre": "Sources", "texte": "Une partie du vocabulaire provient de la thèse de Renouard-Kivouvou (2017), « Dictionnaire lari-français : maquette de la lettre B » (licence CC BY-NC-ND). Application gratuite, sans but commercial.", "exemples": []}]}, "textes": [{"titre_lari": "Kacou 26 : Wa ma tieleka Nzambi waka télé ti ?", "titre_fr": "Dieu a-t-il réellement dit ?", "reference_fr": "Kc.23v7", "paragraphes": [{"n": 1, "lari": "tiangu ti, mu mpadi mù nzololo nzonza samu éwu: Wa ma tieleka Nzambi waka télé ti ? Tomweno tala buna bu fwanakané mu Genèse 3: 1 ti 6! Ntété mu Genèse 2:16 mpé 17, Nzambi wa télé ku Adami ka diandi muti wa mayela mama bote na mama bi. Éva ka ba koko ni Adami wa mu longa wo. Bo nioka bo ka yizidi, ni ku iandi ka yenda.", "fr": "Bien, ce matin je voudrais parler du sujet : Dieu a-t-il réellement dit ? Remarquez bien Genèse 3 :1 à 6 ! D'abord en Genèse 2 :16 et 17, Dieu commanda à Adam de ne pas manger de l'arbre de la connaissance du bien et du mal. Ève n'était pas là et c'est Adam qui le lui prêcha. Mais quand le serpent vint, c'est vers elle qu'il alla."}, {"n": 2, "lari": "Nioka na Éva ni beri nzonza ka mwa ntangu mpé ni ba yi nzonzela samu wa di sumu dia sexe nganti ba sa bu nsuza na yandi. Nioka ni kamu nzonzela nsalulu za bu nsuza ni ba sidi bu nsuza, ni menga ma dukidi ku Éva mpé ma nata ndoko ra tôto ti. Tiangu ti ni menga Abel ka nsongele mpé mu tangu ya ma nsukina, Mfumu Yésu Christo ka nsongele menga mandi ména ma ntalu, mpé ni makatudi di sumu dia bo ba solo mu mbandu ba télé mbandu, na ba ma mê, méno mBikudi kacou Philippe nta lu nzonzela.[ Ndr: di bundu di télé : <<Amen!>>].", "fr": "Le serpent et Ève causèrent un moment et abordèrent le sujet du péché de sexe afin de commettre adultère avec elle. Le serpent lui parla de relation sexuelle et ils commirent adultère, et le sang coula de devant Ève et apporta la malédiction sur la terre. C’est pourquoi c’est le sang que Abel présenta et à la fin des temps, le Seigneur Jésus-Christ présenta son propre sang qui est le sang le plus précieux, et cela effaça le péché de tous les élus de génération en génération, ainsi que les miens, moi le prophète Kacou Philippe qui vous parle. [Ndr : l’assemblée dit : « Amen ! »]."}, {"n": 3, "lari": "Tiangu, rana bandu ni mu sexe ndoko ya kota ra toto ti. Tiangu lu lombolo na luvé mu nvukana na n'kento WA lombolo kwela ku nganda diandi. [Ndr: Dibundu di télé : Amen !>>]. Satana waka zaba kâ taléno miéka yidika: Satana wa ta<< ti! Nzambi ébu katele : ka lu fwena dia ko>>?", "fr": "Ainsi, au commencement c’est par le sexe que la malédiction toucha la terre. Et vous n’avez pas le droit de coucher avec une femme que vous n’avez pas marié auprès de ses parents. [Ndr : L’assemblée dit : « Amen ! »]. Satan était bien au courant de cela mais voyez sa réaction : Satan a dit « Quoi ! Dieu a dit : vous n'en mangerez pas » ?"}, {"n": 4, "lari": "Nzambi wa télé mu verset 17 ya Genèse 2: << bo, lumbu tio tie dia yo, léndi fwa>>. Ka nioka wa télé mu Genèse 3 :4: << ka léndia fwa ko>>. Tiangu ti, ni wo bantu ba lombo bakula lumbu ti. Nka nso butieleka bu lendi duka mu mwa wa twadisi ya mpélo, ngérozo, evangelique na ya branhamiste, samu wéwo kéna mBikudi ko ya mbandu yi mpé ka yandia ko lu fweni lwila. [ Ndr: di bundu di télé : <<Amen !>>]. Ni rana Éva ka bebisila. Tiangu , Éva ka sidi ntembe mpé ni ka dia yo, mpé méso mandi ni mazubuka mpé ni ka batika mu mona ndoji za zingi mpé na bi moni Tiana mBikudi, Nzambi. Mio mia tula rana bandu ni mio mi tula mu tangu ya ma nsukina.", "fr": "Dieu avait dit au verset 17 de Genèse 2 : « Car, au jour où tu en mangeras, tu mourras certainement ». Mais le serpent a dit dans Genèse 3 :4 : « Vous ne mourrez point certainement ». Et cela, c’est ce que les gens ne comprennent pas aujourd’hui. Peu importe la vérité qui peut sortir de la bouche d’un dirigeant catholique, protestant, évangélique et branhamiste, le problème c’est qu’il n’est pas le prophète de la génération et ce n’est pas lui que vous devez écouter. [Ndr : l’assemblée dit : « Amen ! »]. Et ce fut l’erreur de Ève. Finalement, Ève douta et en mangea, et ses yeux s'ouvrirent et elle eut beaucoup de songes et de visions comme un prophète, un Dieu. Et ce qui arriva au commencement, c'est ce qui arrivera à la fin des temps."}, {"n": 5, "lari": "Bala ba bakala ba Nzambi na ba nkuyu bo ba mvutu wa Satana. Bo bavutu tanga ma buku ma ba evangelique, bo bavutu wa ma longi ma ba evangeliques, bo ba bika baba nteseka moko ku bala baba bakala ba mu nkuyu bo bemo ma bundu ma ba mpélo, ngérozo, évangéliques na branhamistes. Na mio, meso mawu mbô ma jibuka mpé bo baba na ndoji za zingi. [Ndr: di bundu di télé : <<Amen!>>].", "fr": "Les fils de Dieu et les fils du diable écouteront encore Satan. Ils liront les livres évangéliques, ils écouteront les prédications évangéliques, ils se laisseront imposer les mains par les fils du diable qui agissent dans ces églises catholiques, protestantes, évangéliques et branhamistes. Et avec cela, leurs yeux s’ouvriront et ils auront beaucoup de songes. [Ndr : l’assemblée dit : « Amen ! »]."}, {"n": 6, "lari": "Tangu yi ti ta kaletiéno rana ratu batikidi. Ntété nsombolo, Satana mu kati dia mbala ma nioka kedi ta ébu : << toko kela ti lumbu tio tia ba wa lunga, bwa landa Nzambi! Wa tidi twenia bu fwanakané mpé :<< toko yidika Zingu tiaku ntété ! Kwendandi ntinu !>> Mpé, rama nima ma ntambulwandi, bu ka mweni builu'iandi, weka batika mu ta: << ti bi ta nsongesa ti mio mieka tama ta miena mia bu tieleka ? Ti bita nsongesa ti ni kuna kwena bu tieleka ??", "fr": "Maintenant revenons à notre texte. Avant la conversion, Satan à travers les enfants du serpent disait : « Attends le jour où tu auras une situation stable, tu pourras suivre Dieu ! Tu es encore trop jeune » ou encore : « Mets ta vie en ordre d'abord ! Ne te presse pas ! » Puis, après l'engagement, voyant sa chute, il commençait à dire : « Qu'est-ce qui prouve que ce qu'il dit est vrai ? Qu'est-ce qui prouve que c'est là-bas que se trouve la vérité » ?"}, {"n": 7, "lari": "Bo lumbu tio nioka tieka mona buku dia mBikudi kacou Philippe, boka sa mayela mama bi mpé na vwenzolo: << oh, buku dio dia nzebi! Wo kani kacou Philippe akô>>? Ti, zabeno ti ni nioka yokwa ya wuna Éva. Ka lubandi ba wubakana! [Ndr: di bundu di télé :<<Amen!>>].", "fr": "Et quand un jour le serpent verra le livre du prophète Kacou Philippe, il dira avec ruse et mépris : « Oh, je connais ce livre ! N'est-ce pas Kacou Philippe » ? Alors, sachez que c'est le même serpent qui avait séduit Ève. Ne soyez pas distraits ! [Ndr : l’assemblée dit : « Amen ! »]."}, {"n": 8, "lari": "Mbo kakota mu bala ba bakala ba Bélial mu ta ti:<< dio tia di bundu dio djieba fungulaka ra yungi dia bantu masimu! Nsoni ze! Yenda kwakà!... Dio tia di bundu di fundisa bantu ka Nzambi télé ti kalu fundisadi ! Bwe di bundu di léndi yokela biblia?... Bio binzambi nzambi>>.", "fr": "Il entre en des fils de Bélial pour dire : « Quelle est cette église où l'on confesse publiquement ses péchés ! C'est trop honteux ! Va ailleurs ! … Quelle est cette église qui juge les gens alors que Dieu dit de ne pas juger ! Comment une église peut-elle brûler une bible ? … C'est une secte »."}, {"n": 9, "lari": "Ni ku koté kwa ya bo ba lembolo na ngolo ka iokelanka mpé lumbu, Satana bo ka sampirika boka ntati mu bala ba bala ba nioka: <<ti! wama tieleka Nzambi waka télé ti biblia dia Louis Segond diena dia mbote ko>>? Mpé Éva nika kuta mwa tangu kà taléno nioka kamu bakila: << Mbô ti biblia dia Louis Segond diena dia mbote ko Mpé waka twikisi néti bo bwa tawata, ngana ni mu nta ti fweni dia ioka ? Wama tieleka Nzambi waka télé ti>>? Mpé Éva jimbakane, mpe nioka lendi : << kalu yiokandi dio! Yimineno dio kwa!>>.", "fr": "Et c'est toujours du côté des faibles qu'il passe et un jour, Satan se dévoilera disant par les arrière-petits-fils du serpent : « Quoi ! Dieu a-t-Il réellement dit que la bible Lou ranhamistes et venir à ce Message, venir auprès du prophète vivant de votre temps. [Ndr : l’assemblée dit : « Amen ! »]. Ève devait rester auprès d’Adam. Et aussi longtemps que Ève restait auprès d’Adam, elle ne péchait pas. C’est la seule chose que vous devez faire pour avoir la Vie éternelle. Et c’est à cela que Dieu vous appelle. Vous êtes avertis ! [Ndr : l’assemblée dit : « Amen ! »]."}, {"n": 12, "lari": "Bata ku Noa Ébu :<<Ta zolo ta tsi ni nge kaka kwa we mu butieleka? Mbô Adam, Abel , Henock, mpe bô babansoni ba fwa avant nge >>mia bata ku Mfumu Yésu-Christo, ku ba mbikudi, ku bilandi mpe mu ntangu yi ku béto neti butieleka bo'le bwe. Bata ébu: <<Noa! donc mu toto wa mvimba, tala muntu ka kotela mu bwatu bwaku kô, Nzambi bo ka mu diamisa mu mvula >>. Bu bedi seka mpe bedi seka Noa. Mpé mpila mosi kwa lumbu tsi.", "fr": "Ils ont dit à Noé : « Tu veux dire que c'est toi seul qui es dans la vérité ? Et Adam, Abel, Hénoc, et tous ceux qui sont morts avant toi » Ils ont dit cela au Seigneur Jésus-Christ, aux prophètes, aux apôtres et maintenant à nous comme s'il y a deux vérités. Ils ont dit : « Noé ! Donc sur toute la terre, si quelqu'un n'entre pas dans ton arche, Dieu va l'engloutir dans le déluge » Ils riaient et se moquaient de Noé. Et c'est la même chose aujourd'hui."}, {"n": 13, "lari": "Mbô ba seka mpe mbô ba seka mu nzo nzambi zawu, ku bi salu biawu,mu nzo zawu. Mbô ba ta: << tia fwaso mu toto ti wa mvimba ,ni mu iandi kwa Kacou Philippe tu fweni kwikila mu bvuka? kani ! Nzambi kalendia kata bokò! Mvukisi ni Yésu-Christo.Ni iandi wa fwa ga kulusu. Ni iandi wa tu kula. Mu sumuki néti nge kacou Philippe, ngana ni nge tu kula bùbù? bwe na bwe mita zolo ta mio? Nzambi wa ma tieleka ni bo kata mu lumbu tia 24 Avril 1993>>? Wa ma tieleka kundi , Nzambi ni bo Kata!", "fr": "Ils rient et se moquent dans leurs églises, dans leurs bureaux, dans leurs maisons. Ils disent : « Comment sur toute la face de la terre, c’est en lui seul Kacou Philippe que nous devons croire pour être sauvés ? Non ! Dieu ne peut pas dire cela ! Le Sauveur c’est Jésus-Christ. C’est lui qui est mort sur la croix. C’est lui qui nous a rachetés. Un pécheur comme toi Kacou Philippe, est-ce toi qui vas nous sauver maintenant ? Qu’est-ce que cela veut dire ? Dieu a-t-Il réellement dit cela le 24 avril 1993 » ? Oui monsieur, Dieu l’a dit !"}, {"n": 14, "lari": "Mpila mosi Mari ka butidi mu bimangu kani bakala ka zaba, Mpila mosi Mosé ka tabudi mio mia maso ma yoka ku mbandukulu nge mpe tabudi mambu ma Imvu na imvu lumbu tia 24 Avril 1993 mpe mikangamané ku Nzambi, ntangu bu yi lunga mbu bakuswa mpe bô longa mio miowa lombo longoka kansi konso muntu kwikila ka tabumbula moyo wa Imvu na imvu. Di bundu di télé<<Amen>> Nzambi waka ku Noa, Nzambi waka ku Mosé, Nzambi waka ku ba bikudi babo nsoni mu ntangwa wu.", "fr": "« De la même manière que Marie a conçu miraculeusement sans connaître d’homme, de la même manière que Moïse a reçu dans les détails ce qui s’est passé à la création, toi aussi tu as reçu les Paroles de la Vie éternelle ce 24 avril 1993 et cela est arrêté de la part de Dieu. Au temps marqué, tu comprendras et tu enseigneras ce que tu n’as pas appris afin que quiconque croit, ait la Vie éternelle. ». [Ndr : l’assemblée dit : « Amen ! »]. Dieu l’avait dit à Noé. Dieu l’avait dit à Moïse, Dieu avait dit à tous les prophètes en leur temps."}, {"n": 15, "lari": "Mpé lumbu ti, Nzambi waka télé ku bikudi kacou Philippe mu lumbu tia 24 Avril 1993. Mpe ti lwena mwana Nzambi, ni mu iandi, kacou Philippe lu fweni kwikila mu mvuka. Mboko ti wa tieleka Mpeve ya longo ye neno, Mpeve yo ya longo mbo yi lu nata ku iandi, bikudi ya ntangw'eno, néti ti lumbu, Mpeve yo ya longo ya nata Corneille ku Pierre iandi wa ba na mvungula za maZulu. Di bundu di télé<<Amen>> . Mbô ti weneno lwa sadila Nzambi, ni mu wakasa nsangu za mio mi télé bikudi kacou Philippe, bikudi ya moyo ya ntangu yi: mpé ni xi kwa lu fweni sa>>", "fr": "Et aujourd’hui, Dieu l’a dit au prophète Kacou Philippe le 24 avril 1993. Et si vous êtes un enfant de Dieu, c’est en lui, Kacou Philippe que vous devez croire pour être sauvé. Et si vous avez réellement le Saint-Esprit, ce Saint-Esprit vous conduira à lui, le prophète de votre temps, comme un jour, ce Saint-Esprit a conduit Corneille vers Pierre qui avait les clés du Royaume des Cieux. [Ndr : l’assemblée dit : « Amen ! »]. Et si vous devez servir Dieu, c’est de faire l’écho de ce que le prophète Kacou Philippe, le prophète vivant de votre temps dit. Et c’est la seule chose que vous puissiez faire."}, {"n": 16, "lari": "Or Satana ka kwiza kwa mu nzonzolo ko kà na mu mabanza, Satana mbôka ta kala fweti ku manima mu ntomo tala Satana mbôka dinga mu lu nata mala na di bundu, ngati ka luzimbangasa kulu bika di, kani nsamu ka lumangisa kadi ku nzo nzambi tala ka lwena na mpemba ya fwanakana ko, Bikeno dila zanza nsoni mu kweda yo ya Nzambi, Solone lwa sala mu kumbisa Nzambi ké lwendi lwa kumbisa mvumbi.", "fr": "Or Satan ne viendra pas seulement en parole mais aussi en pensée. Satan dira : « Prends un peu de recul pour bien voir ! ». Satan cherchera à vous éloigner de l'assemblée pour vous éteindre. Ne cédez jamais ! Pour rien au monde, ne manquez jamais à un culte sauf pour une raison juste. Annulez tous les rendez-vous pour être à celui de Dieu. Choisissez de rester pour adorer Dieu plutôt que d'aller enterrer un mort. Et que celui qui a des oreilles pour entendre entende !"}]}]};
const ALL = [];
DATA.categories.forEach((c, ci) => c.entrees.forEach((e, ei) => ALL.push({ id: ci + "-" + ei, cat: c.nom, fr: e.fr, lari: e.lari, ref: e.ref })));
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[\u2019\u2018\u00b4`]/g, "'");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let store = {};
try { store = JSON.parse(localStorage.getItem("kilari") || "{}"); } catch (e) { store = {}; }
store.known = store.known || {};
const save = () => { try { localStorage.setItem("kilari", JSON.stringify(store)); } catch (e) {} };

const S = {
  tab: "trad", dir: "fr", q: "", cat: "",
  fcScope: "", fc: null,
  qzScope: "", qz: null,
  tx: { open: null, shown: {} },
  hitsOpen: false,
  trText: "", lastTr: "", lastMiss: []
};
document.getElementById("meta").textContent = DATA.meta.entrees + " mots et phrases · " + DATA.meta.categories + " thèmes · " + DATA.textes.length + " texte" + (DATA.textes.length > 1 ? "s" : "");

const dirSeg = () => `<div class="seg" role="group" aria-label="Sens">
  <button data-act="dir" data-v="fr" aria-pressed="${S.dir === "fr"}">Français → Lari</button>
  <button data-act="dir" data-v="la" aria-pressed="${S.dir === "la"}">Lari → Français</button></div>`;
const catOptions = (sel, extra) => `<option value="">Tous les thèmes</option>` + (extra || "") +
  DATA.categories.map(c => `<option value="${esc(c.nom)}" ${sel === c.nom ? "selected" : ""}>${esc(c.nom)} (${c.entrees.length})</option>`).join("");
const src = e => S.dir === "fr" ? e.fr : e.lari;
const dst = e => S.dir === "fr" ? e.lari : e.fr;
const dstCls = () => S.dir === "fr" ? "is-lari" : "";
const srcCls = () => S.dir === "la" ? "is-lari" : "";

function nmap(text) {
  let n = "", map = [];
  for (let i = 0; i < text.length; i++) { const s = norm(text[i]); for (let j = 0; j < s.length; j++) { n += s[j]; map.push(i); } }
  return { n, map };
}
function excerpt(text, q) {
  const m = nmap(text), k = m.n.indexOf(q);
  if (k < 0) return null;
  const s = m.map[k], e = m.map[k + q.length - 1] + 1;
  const a = Math.max(0, s - 70), b = Math.min(text.length, e + 90);
  return (a > 0 ? "… " : "") + esc(text.slice(a, s)) + "<mark>" + esc(text.slice(s, e)) + "</mark>" + esc(text.slice(e, b)) + (b < text.length ? " …" : "");
}
function textHits(qn) {
  if (qn.length < 3) return [];
  const out = [];
  DATA.textes.forEach((t, ti) => t.paragraphes.forEach(p => {
    const f = excerpt(p.fr, qn), l = excerpt(p.lari, qn);
    if (f || l) out.push({ ti: ti, n: p.n, titre: t.titre_fr, f: f, l: l });
  }));
  return out;
}
function results() {
  const qn = norm(S.q).replace(/\s+/g, " ").trim();
  const list = ALL.filter(e => (!S.cat || e.cat === S.cat) && (!qn || norm(e.fr).includes(qn) || norm(e.lari).includes(qn)));
  return { list: list, hits: S.cat ? [] : textHits(qn) };
}
function hitsHTML(r) {
  const hits = r.hits;
  if (!hits.length) return "";
  if (r.list.length && !S.hitsOpen) return `<button class="tog" data-act="hits" style="margin-top:10px">Voir aussi dans les textes (${hits.length})</button>`;
  return `<div class="group">Dans les textes</div>` + hits.map(h => `<div class="entry"><div class="a">${esc(h.titre)} · paragraphe ${h.n}</div>
    ${h.f ? `<div class="hit"><span class="lg">FR</span>${h.f}</div>` : ""}${h.l ? `<div class="hit"><span class="lg">Lari</span>${h.l}</div>` : ""}
    <button class="tog" data-act="tgo" data-ti="${h.ti}" data-n="${h.n}">Lire ce paragraphe et sa traduction</button></div>`).join("");
}
function resultsHTML(r) { return listHTML(r.list, r.hits.length > 0) + hitsHTML(r); }
function countText(r) { const n = r.list.length + (r.list.length && !S.hitsOpen ? 0 : r.hits.length); return n + " résultat" + (n > 1 ? "s" : ""); }
function renderMots() {
  const r = results();
  document.getElementById("view").innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">
    <input id="q" class="field" type="search" placeholder="Chercher un mot, une expression ou une phrase" value="${esc(S.q)}" autocomplete="off">
    <div class="row">${dirSeg()}</div>
    <div class="chips">${[["", "Tout"]].concat(DATA.categories.map(c => [c.nom, c.nom])).map(([v, l]) =>
      `<button class="chip" data-act="cat" data-v="${esc(v)}" aria-pressed="${S.cat === v}">${esc(l)}</button>`).join("")}</div>
    <div class="count" id="cnt">${countText(r)}</div><div id="list">${resultsHTML(r)}</div></div>`;
}
function listHTML(list, hasHits) {
  if (!list.length) return hasHits ? "" : `<div class="empty">Aucun résultat. Essayez un autre mot ou un autre thème.</div>`;
  let last = null, out = "";
  list.forEach(e => {
    if (e.cat !== last) { out += `<div class="group">${esc(e.cat)}</div>`; last = e.cat; }
    out += `<div class="entry"><div class="a ${srcCls()}">${esc(src(e))}</div><div class="b ${dstCls()}">${esc(dst(e))}</div>${e.ref ? `<div class="count">${esc(e.ref)}</div>` : ""}</div>`;
  });
  return out;
}
function refreshList() {
  const r = results();
  document.getElementById("list").innerHTML = resultsHTML(r);
  document.getElementById("cnt").textContent = countText(r);
}

/* ---------- Fiches ---------- */
function poolFor(scope) {
  if (scope === "__todo") return ALL.filter(e => !store.known[e.id]);
  return ALL.filter(e => !scope || e.cat === scope);
}
function startFc() { S.fc = { deck: shuffle(poolFor(S.fcScope)), i: 0, flip: false, got: 0 }; }
function renderFiches() {
  if (!S.fc) startFc();
  const f = S.fc, known = Object.keys(store.known).length;
  let html = `<div style="display:flex;flex-direction:column;gap:12px">
    <select id="fcScope" class="field" aria-label="Thème des fiches">${catOptions(S.fcScope, `<option value="__todo" ${S.fcScope === "__todo" ? "selected" : ""}>Mots pas encore sus</option>`)}</select>
    <div class="row" style="justify-content:space-between">${dirSeg()}<span class="count">${known} / ${ALL.length} sus</span></div>`;
  if (!f.deck.length) {
    html += `<div class="panel"><h2>Rien à réviser ici</h2><p class="sub">Tous les mots de ce choix sont marqués comme sus.</p><button class="btn" data-act="resetKnown">Remettre à zéro la progression</button></div>`;
  } else if (f.i >= f.deck.length) {
    html += `<div class="panel"><h2>Série terminée</h2><div class="score">${f.got} / ${f.deck.length}</div><p class="sub">mots sus du premier coup.</p><button class="btn" data-act="fcRestart">Recommencer</button></div>`;
  } else {
    const e = f.deck[f.i];
    html += `<div class="bar" aria-hidden="true"><i style="width:${Math.round(f.i / f.deck.length * 100)}%"></i></div>
    <button class="card" data-act="flip" aria-label="Retourner la fiche">
      <span class="tag">${esc(e.cat)}</span>
      <span class="big ${f.flip ? dstCls() : srcCls()}">${esc(f.flip ? dst(e) : src(e))}</span>
      <span class="hint">${f.flip ? "" : "Touchez pour voir la réponse"}</span>
    </button>
    <div class="count">Fiche ${f.i + 1} sur ${f.deck.length}</div>`;
    if (f.flip) html += `<div class="btns"><button class="btn alt" data-act="again">À revoir</button><button class="btn" data-act="know">Je sais</button></div>`;
  }
  document.getElementById("view").innerHTML = html + "</div>";
}

/* ---------- Quiz ---------- */
function startQz() {
  const pool = shuffle(poolFor(S.qzScope)).slice(0, 10);
  S.qz = { qs: pool, i: 0, score: 0, picked: null, opts: null };
}
function makeOpts(e) {
  const ans = dst(e);
  const others = shuffle(ALL.filter(x => dst(x) !== ans && src(x) !== src(e) && x.id !== e.id)).map(dst);
  const uniq = [];
  for (const o of others) { if (!uniq.includes(o)) uniq.push(o); if (uniq.length === 3) break; }
  return shuffle([ans].concat(uniq));
}
function renderQuiz() {
  if (!S.qz) startQz();
  const z = S.qz;
  let html = `<div style="display:flex;flex-direction:column;gap:12px">
    <select id="qzScope" class="field" aria-label="Thème du quiz">${catOptions(S.qzScope)}</select>
    <div class="row">${dirSeg()}</div>`;
  if (z.i >= z.qs.length) {
    html += `<div class="panel"><h2>Quiz terminé</h2><div class="score">${z.score} / ${z.qs.length}</div>
      <p class="sub">${z.score === z.qs.length ? "Sans faute." : "Relancez un quiz pour progresser."}</p><button class="btn" data-act="qzRestart">Nouveau quiz</button></div>`;
  } else {
    const e = z.qs[z.i];
    if (!z.opts) z.opts = makeOpts(e);
    const ans = dst(e);
    html += `<div class="bar" aria-hidden="true"><i style="width:${Math.round(z.i / z.qs.length * 100)}%"></i></div>
      <div class="count">Question ${z.i + 1} sur ${z.qs.length} · score ${z.score}</div>
      <div class="panel"><span class="count">Traduire</span><div class="q ${srcCls()}">${esc(src(e))}</div></div>
      <div class="opts">${z.opts.map((o, k) => {
        let cls = "opt";
        if (z.picked !== null) { if (o === ans) cls += " good"; else if (k === z.picked) cls += " wrong"; }
        return `<button class="${cls}" data-act="pick" data-k="${k}" ${z.picked !== null ? "disabled" : ""}>${esc(o)}</button>`;
      }).join("")}</div>`;
    if (z.picked !== null) html += `<button class="btn" data-act="next">${z.i + 1 >= z.qs.length ? "Voir le score" : "Question suivante"}</button>`;
  }
  document.getElementById("view").innerHTML = html + "</div>";
}

/* ---------- Traducteur ---------- */
const TR = { fr: null, la: null };
const keyOf = s => (norm(s).match(/[\p{L}\p{N}]+/gu) || []).join(" ");
const cleanForm = s => s.replace(/\([^)]*\)/g, " ").replace(/\s+/g, " ").trim();
const splitAlt = s => s.split(/\s*,\s*|\s+ou\s+/).map(x => x.replace(/[?!.…]+$/, "").trim()).filter(Boolean);
function pairsOf(fr, la) {
  const f = cleanForm(fr), l = cleanForm(la), fs = f.split("/"), ls = l.split("/");
  if (fs.length > 1 && fs.length === ls.length) return fs.map((x, i) => [x.trim(), ls[i].trim()]);
  const pm = f.match(/^(il|ils|tu|vous|nous|je)\/(elle|elles|on|il|ils)\s+(.+)$/i);
  if (pm && ls.length === 1) return [[pm[1] + " " + pm[3], l], [pm[2] + " " + pm[3], l]];
  return [[f.replace(/\//g, " ou "), l.replace(/\//g, " ou ")]];
}
const ARTICLES = new Set(["le", "la", "les", "l", "un", "une", "des", "du", "de", "d"]);
function buildIdx(d) {
  const m = new Map(), weak = [];
  const add = (k, tr, full, src, isWeak) => {
    if (!k || !tr) return;
    const cur = m.get(k);
    if (!cur) m.set(k, { tr: [tr], full: [full], src: src });
    else if (!isWeak && !cur.tr.includes(tr)) { cur.tr.push(tr); cur.full.push(full); }
  };
  ALL.forEach(e => pairsOf(e.fr, e.lari).forEach(([f, l]) => {
    const fv = splitAlt(f), lv = splitAlt(l);
    if (!fv.length || !lv.length) return;
    if (d === "fr") {
      fv.forEach(v => {
        const k = keyOf(v); add(k, lv[0], lv.join(" / "), v);
        const tk = k.split(" "); while (tk.length > 1 && ARTICLES.has(tk[0])) tk.shift();
        if (tk.join(" ") !== k) weak.push([tk.join(" "), lv[0], lv.join(" / "), v]);
      });
    } else {
      lv.forEach(v => add(keyOf(v), fv[0], fv.join(" / "), v));
    }
  }));
  weak.forEach(w => add(w[0], w[1], w[2], w[3], true));
  return m;
}
function tokenize(text) {
  const re = /[\p{L}\p{N}]+/gu, parts = []; let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) parts.push({ s: text.slice(last, m.index) });
    parts.push({ w: m[0], n: norm(m[0]) }); last = re.lastIndex;
  }
  if (last < text.length) parts.push({ s: text.slice(last) });
  return parts;
}
function translate(text) {
  const d = S.dir; if (!TR[d]) TR[d] = buildIdx(d);
  const idx = TR[d], parts = tokenize(text), wi = [];
  parts.forEach((p, i) => { if (p.w !== undefined) wi.push(i); });
  const groups = new Map(), miss = [], detail = new Map();
  let found = 0, total = 0, i = 0;
  while (i < wi.length) {
    let hit = null;
    const start0 = wi[i];
    for (let L = Math.min(7, wi.length - i); L >= 1 && !hit; L--) {
      let ok = true;
      for (let k = i; k < i + L - 1; k++) {
        const between = parts.slice(wi[k] + 1, wi[k + 1]).map(p => p.s).join("");
        if (/[.!?;:\n…]/.test(between)) { ok = false; break; }
      }
      if (!ok) continue;
      const key = wi.slice(i, i + L).map(j => parts[j].n).join(" ");
      const e = idx.get(key);
      if (e && d === "fr" && L === 1 && key === "a" && parts[start0].w.toLowerCase() !== "à") continue;
      if (e) hit = { L: L, e: e };
    }
    const start = wi[i];
    if (hit) {
      const end = wi[i + hit.L - 1];
      const srcText = parts.slice(start, end + 1).map(p => p.s !== undefined ? p.s : p.w).join("");
      groups.set(start, { end: end, item: { kind: "tr", t: hit.e.tr[0], all: hit.e.full.join(" ; ") } });
      if (!detail.has(srcText.toLowerCase())) detail.set(srcText.toLowerCase(), { src: srcText, tr: hit.e.full.join(" ; "), n: hit.L });
      found += hit.L; total += hit.L; i += hit.L;
    } else {
      const w = parts[start].w;
      if (d === "fr" && ARTICLES.has(parts[start].n)) groups.set(start, { end: start, item: { kind: "skip" } });
      else { total++; if (!miss.includes(w.toLowerCase())) miss.push(w.toLowerCase()); groups.set(start, { end: start, item: { kind: "miss", t: w } }); }
      i++;
    }
  }
  let html = "", plain = "", p = 0, dropSep = false;
  while (p < parts.length) {
    const g = groups.get(p);
    if (g) {
      const it = g.item;
      if (it.kind === "skip") dropSep = true;
      else {
        dropSep = false;
        if (it.kind === "tr") { html += `<span class="trw" title="${esc(it.all)}">${esc(it.t)}</span>`; plain += it.t; }
        else { html += `<span class="miss">${esc(it.t)}</span>`; plain += "[" + it.t + "]"; }
      }
      p = g.end + 1; continue;
    }
    const s = parts[p].s;
    if (dropSep && /^[\s'’\-]*$/.test(s)) { dropSep = false; p++; continue; }
    dropSep = false;
    html += esc(s).replace(/\n/g, "<br>"); plain += s; p++;
  }
  return { html: html, plain: plain.replace(/ {2,}/g, " ").trim(), found: found, total: total, miss: miss, detail: Array.from(detail.values()) };
}
async function copyText(txt, btn) {
  const old = btn.textContent;
  const done = m => { btn.textContent = m; setTimeout(() => { btn.textContent = old; }, 1400); };
  try { await navigator.clipboard.writeText(txt); done("Copié"); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done("Copié"); } catch (_) { done("Copie impossible"); }
    ta.remove();
  }
}
function updateTr() {
  const el = document.getElementById("trOut"); if (!el) return;
  if (!S.trText.trim()) {
    S.lastTr = ""; S.lastMiss = [];
    el.innerHTML = `<div class="note">Écrivez ou collez un texte. Chaque mot ou expression présent dans le dictionnaire (${ALL.length} entrées) est traduit. Les autres restent soulignés en pointillés.</div>`;
    return;
  }
  const r = translate(S.trText); S.lastTr = r.plain; S.lastMiss = r.miss;
  el.innerHTML = `<div class="panel"><div class="count">${S.dir === "fr" ? "Traduction en lari" : "Traduction en français"}</div>
    <div class="trout">${r.html}</div>
    <div class="row"><button class="btn alt" data-act="trcopy">Copier la traduction</button>
    <span class="count">${r.found} sur ${r.total} mot${r.total > 1 ? "s" : ""} traduit${r.found > 1 ? "s" : ""}</span></div></div>
    <div class="note">Traduction mot à mot et expression par expression. Les règles du lari (préfixes des noms, conjugaison) ne sont pas appliquées : relisez toujours le résultat.</div>
    ${r.miss.length ? `<div class="panel"><h3>Pas encore dans le dictionnaire (${r.miss.length})</h3>
      <div class="wrapchips">${r.miss.map(w => `<span class="chip">${esc(w)}</span>`).join("")}</div>
      <button class="btn alt" data-act="misscopy">Copier la liste</button></div>` : ""}
    ${r.detail.length ? `<details class="panel"><summary>Détail des correspondances (${r.detail.length})</summary>
      ${r.detail.map(x => `<div class="det">${esc(x.src)} → <b>${esc(x.tr)}</b></div>`).join("")}</details>` : ""}`;
}
function renderTraduire() {
  document.getElementById("view").innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">
    <h2>Traducteur</h2><div class="row">${dirSeg()}</div>
    <textarea id="trIn" class="field" rows="5" placeholder="${S.dir === "fr" ? "Texte en français" : "Texte en lari"}">${esc(S.trText)}</textarea>
    <div id="trOut" style="display:flex;flex-direction:column;gap:12px"></div></div>`;
  updateTr();
}

/* ---------- Textes ---------- */
function renderTextes() {
  const T = DATA.textes, v = document.getElementById("view");
  if (S.tx.open === null) {
    v.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px"><h2>Textes</h2>
      <p class="sub">Lisez le texte en lari, puis touchez un paragraphe pour voir sa traduction en français.</p>
      ${T.map((x, i) => `<button class="panel textcard" data-act="topen" data-v="${i}"><h3>${esc(x.titre_fr)}</h3>
        <span class="is-lari-txt">${esc(x.titre_lari)}</span><span class="count">${x.paragraphes.length} paragraphes</span></button>`).join("")}</div>`;
    return;
  }
  const x = T[S.tx.open], all = x.paragraphes.every(p => S.tx.shown[p.n]);
  v.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">
    <div class="row" style="justify-content:space-between"><button class="btn alt" data-act="tback">← Textes</button>
    <button class="btn alt" data-act="tall">${all ? "Masquer tout" : "Tout traduire"}</button></div>
    <h2 class="is-lari-txt">${esc(x.titre_lari)}</h2><div class="sub">${esc(x.titre_fr)}</div>
    ${x.paragraphes.map(p => `<div class="para" id="p${p.n}"><span class="pn">${p.n}</span>
      <p class="lt">${esc(p.lari)}</p>
      <button class="tog" data-act="tpar" data-v="${p.n}" aria-expanded="${!!S.tx.shown[p.n]}">${S.tx.shown[p.n] ? "Masquer la traduction" : "Voir la traduction"}</button>
      ${S.tx.shown[p.n] ? `<p class="ft">${esc(p.fr)}</p>` : ""}</div>`).join("")}</div>`;
}

/* ---------- Grammaire ---------- */
function renderGram() {
  const g = DATA.grammaire;
  document.getElementById("view").innerHTML = `<div class="gr">
    <h2>Les classes nominales</h2>
    <p class="sub">Le préfixe d'un nom indique sa classe, comme pour les autres langues bantoues.</p>
    ${g.classes_nominales.map(c => `<div class="panel"><div class="cls"><span class="pre">${esc(c.prefixe)}</span><h3>${esc(c.classe)}</h3></div>
      <div class="ex">${esc(c.fr)} : <b>${esc(c.lari)}</b></div></div>`).join("")}
    <h2 style="margin-top:8px">Règles</h2>
    ${g.regles.map(r => `<div class="panel"><h3>${esc(r.titre)}</h3><p style="margin:0">${esc(r.texte)}</p>
      ${r.exemples.map(x => `<div class="ex">${esc(x.fr)} : <b>${esc(x.lari)}</b>${x.detail ? `<div class="det">${esc(x.detail)}</div>` : ""}</div>`).join("")}</div>`).join("")}
  </div>`;
}

function render() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.toggleAttribute("aria-current", b.dataset.v === S.tab) || b.removeAttribute("aria-current"));
  document.querySelectorAll("nav.tabs button").forEach(b => { if (b.dataset.v === S.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  ({ trad: renderTraduire, mots: renderMots, fiches: renderFiches, quiz: renderQuiz, textes: renderTextes, gram: renderGram })[S.tab]();
}

document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act, v = t.dataset.v, f = S.fc, z = S.qz;
  if (a === "trcopy" || a === "misscopy") { copyText(a === "trcopy" ? S.lastTr : S.lastMiss.join("\n"), t); return; }
  if (a === "tab") { S.tab = v; window.scrollTo(0, 0); }
  else if (a === "hits") { S.hitsOpen = !S.hitsOpen; }
  else if (a === "tgo") { S.tab = "textes"; S.tx.open = +t.dataset.ti; S.tx.shown = {}; S.tx.shown[t.dataset.n] = true; S.tx.focus = t.dataset.n; }
  else if (a === "topen") { S.tx.open = +v; S.tx.shown = {}; window.scrollTo(0, 0); }
  else if (a === "tback") { S.tx.open = null; window.scrollTo(0, 0); }
  else if (a === "tpar") { S.tx.shown[v] = !S.tx.shown[v]; }
  else if (a === "tall") { const ps = DATA.textes[S.tx.open].paragraphes; const all = ps.every(p => S.tx.shown[p.n]); ps.forEach(p => { S.tx.shown[p.n] = !all; }); }
  else if (a === "dir") { S.dir = v; if (S.qz) { S.qz.opts = null; S.qz.picked = null; } }
  else if (a === "cat") { S.cat = v; }
  else if (a === "flip") { f.flip = !f.flip; }
  else if (a === "know") { const e = f.deck[f.i]; store.known[e.id] = 1; save(); if (!e.retry) f.got++; f.i++; f.flip = false; }
  else if (a === "again") { const e = f.deck[f.i]; delete store.known[e.id]; save(); f.deck.push(Object.assign({}, e, { retry: true })); f.i++; f.flip = false; }
  else if (a === "fcRestart") { startFc(); }
  else if (a === "resetKnown") { store.known = {}; save(); S.fcScope = ""; startFc(); }
  else if (a === "pick") { if (z.picked === null) { z.picked = +t.dataset.k; if (z.opts[z.picked] === dst(z.qs[z.i])) z.score++; } }
  else if (a === "next") { z.i++; z.picked = null; z.opts = null; }
  else if (a === "qzRestart") { startQz(); }
  render();
  if (S.tx.focus) { const el = document.getElementById("p" + S.tx.focus); S.tx.focus = null; if (el) el.scrollIntoView(); }
});
document.addEventListener("input", ev => {
  if (ev.target.id === "q") { S.q = ev.target.value; S.hitsOpen = false; refreshList(); }
  if (ev.target.id === "trIn") { S.trText = ev.target.value; updateTr(); }
});
document.addEventListener("change", ev => {
  if (ev.target.id === "fcScope") { S.fcScope = ev.target.value; startFc(); render(); }
  if (ev.target.id === "qzScope") { S.qzScope = ev.target.value; startQz(); render(); }
});
render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
